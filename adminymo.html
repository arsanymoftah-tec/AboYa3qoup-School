<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة الأدمن — إدارة المدرسة</title>
<meta name="theme-color" content="#7c3aed" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800;900&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f4f6f9;--surface:#fff;--surface-2:#f9fafb;--border:#e5e7eb;
  --text:#111827;--text-2:#4b5563;--text-3:#9ca3af;
  --primary:#7c3aed;--primary-2:#6d28d9;--primary-soft:#ede9fe;
  --teal:#0f766e;--teal-soft:#ccfbf1;
  --ok:#059669;--ok-soft:#d1fae5;--bad:#dc2626;--bad-soft:#fee2e2;
  --warn:#d97706;--warn-soft:#fef3c7;--info:#2563eb;--info-soft:#dbeafe;
  --gold:#f59e0b;--gold-soft:#fef3c7;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);--shadow:0 2px 8px rgba(0,0,0,.06);--shadow-lg:0 8px 24px rgba(0,0,0,.08);
  --radius:12px;--radius-sm:8px;--radius-lg:16px;--sidebar-w:255px;--tr:150ms ease;
  --font-title:'Zain',system-ui,sans-serif;--font-body:'Almarai',system-ui,sans-serif;
}
[data-theme=dark]{--bg:#0b1220;--surface:#111a2e;--surface-2:#0f1728;--border:#1e293b;
  --text:#e5e7eb;--text-2:#94a3b8;--text-3:#64748b;--primary:#a78bfa;--primary-2:#c4b5fd;
  --primary-soft:#2e1065;--teal:#14b8a6;--teal-soft:#042f2e;
  --ok:#10b981;--ok-soft:#064e3b;--bad:#f87171;--bad-soft:#450a0a;
  --warn:#fbbf24;--warn-soft:#451a03;--info:#60a5fa;--info-soft:#1e3a8a;
  --gold:#fbbf24;--gold-soft:#451a03;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 2px 8px rgba(0,0,0,.5);--shadow-lg:0 8px 24px rgba(0,0,0,.6);}
html,body{height:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.7;transition:background var(--tr),color var(--tr);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,h6,.page-title,.brand,.hero h1,.auth-title{font-family:var(--font-title);font-weight:800;letter-spacing:-.3px}
button,input,select,textarea{font-family:var(--font-body);font-size:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary);text-decoration:none}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
.brand{display:flex;align-items:center;gap:10px;padding:18px;border-bottom:1px solid var(--border);font-size:17px}
.brand i{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;font-size:16px}
.side-user{padding:14px 18px;border-bottom:1px solid var(--border)}
.side-user .u-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.side-user .u-meta{font-size:12px;color:var(--text-3);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-3);padding:14px 12px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--text-2);text-decoration:none;font-size:13.5px;transition:all var(--tr);cursor:pointer}
.nav a i{width:18px;text-align:center;font-size:14px}
.nav a:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.nav a.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav a .cnt{margin-right:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;min-width:20px;text-align:center}
.side-foot{padding:12px 10px;border-top:1px solid var(--border)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);transition:all var(--tr)}
.icon-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.side-foot .theme-toggle{width:100%;justify-content:flex-start;gap:10px;padding:8px 12px;font-size:13px;height:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:40}
.page-title{font-size:18px;display:flex;align-items:center;gap:10px}
.page-title i{color:var(--primary)}
.top-actions{display:flex;gap:8px;align-items:center}
.menu-btn{display:none}
.content{padding:24px;flex:1}
.container{max-width:1280px;margin:0 auto;padding:0}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);transition:box-shadow var(--tr)}
.card:hover{box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.card-head h3{font-size:15px;display:flex;align-items:center;gap:8px;margin:0}
.card-head h3 i{color:var(--primary)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;transition:all var(--tr);border:1px solid transparent;white-space:nowrap;line-height:1.4;font-family:var(--font-body)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn i{font-size:13px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-2)}
.btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--border)}.btn-secondary:hover{background:var(--border)}
.btn-success{background:var(--ok);color:#fff}.btn-success:hover{filter:brightness(1.1)}
.btn-danger{background:var(--bad);color:#fff}.btn-danger:hover{filter:brightness(1.1)}
.btn-warn{background:var(--warn);color:#fff}.btn-warn:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;color:var(--text-2)}.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.btn-xs{padding:3px 8px;font-size:11.5px;border-radius:6px}
.btn-block{width:100%}

.form{display:flex;flex-direction:column;gap:14px}
.form-row{display:flex;gap:12px;flex-wrap:wrap}
.form-row > *{flex:1 1 180px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-size:12.5px;font-weight:700;color:var(--text-2)}
.input,select.input,textarea.input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-family:var(--font-body);transition:border-color var(--tr),box-shadow var(--tr)}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input:disabled{background:var(--surface-2);color:var(--text-3);cursor:not-allowed}
textarea.input{min-height:80px;resize:vertical}
.check-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-2);cursor:pointer}
.check-row input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.toolbar .input{flex:1 1 180px;padding:7px 12px;font-size:13px}
.toolbar .search-wrap{position:relative;flex:1 1 220px}
.toolbar .search-wrap i{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.toolbar .search-wrap .input{padding-right:36px}

.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:11px 14px;text-align:right;vertical-align:middle;border-bottom:1px solid var(--border)}
th{background:var(--surface-2);font-size:11.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr{transition:background var(--tr)}
tbody tr:hover{background:var(--surface-2)}
td .actions{display:flex;gap:4px;flex-wrap:wrap}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;line-height:1.6}
.badge-ok{background:var(--ok-soft);color:var(--ok)}
.badge-bad{background:var(--bad-soft);color:var(--bad)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-primary{background:var(--primary-soft);color:var(--primary)}
.badge-gold{background:var(--gold-soft);color:var(--gold)}

.code-pill{display:inline-block;padding:2px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);font-family:'Courier New',monospace;font-size:12px;font-weight:700;letter-spacing:.5px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:14px;transition:all var(--tr)}
.stat:hover{box-shadow:var(--shadow);border-color:var(--primary-soft)}
.stat .ico{width:42px;height:42px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.stat .num{font-size:22px;font-weight:800;line-height:1.1;font-family:var(--font-title)}
.stat .lbl{font-size:12px;color:var(--text-3);margin-top:2px}

.alert{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:8px;border:1px solid;font-size:13.5px;margin-bottom:14px}
.alert i{margin-top:2px}
.alert-success{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.alert-error{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.alert-warning{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.alert-info{background:var(--info-soft);border-color:var(--info);color:var(--info)}

.empty{text-align:center;padding:40px 20px;color:var(--text-3);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty i{font-size:36px;opacity:.4}

.chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding:12px 0 32px;border-bottom:1px solid var(--border);position:relative}
.chart .bar{flex:1;min-height:4px;background:var(--primary);border-radius:6px 6px 0 0;position:relative;transition:filter var(--tr)}
.chart .bar:hover{filter:brightness(1.15)}
.chart .bar .v{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--primary)}
.chart .bar .l{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-3);white-space:nowrap}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
.bar-row .n{min-width:110px;color:var(--text-2)}
.bar-row .track{flex:1;height:18px;background:var(--surface-2);border-radius:20px;overflow:hidden;border:1px solid var(--border)}
.bar-row .fill{height:100%;background:var(--primary);border-radius:20px;display:flex;align-items:center;justify-content:flex-end;padding-left:8px;color:#fff;font-size:11px;font-weight:700;transition:width .5s ease}
.bar-row .v{min-width:50px;text-align:left;font-weight:700;font-size:12.5px}

.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin:16px 0 12px}
.podium .p{text-align:center;padding:14px 8px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);transition:transform var(--tr)}
.podium .p:hover{transform:translateY(-3px)}
.podium .p .avatar{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;margin-bottom:6px}
.podium .p .nm{font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .p .sc{font-size:11.5px;color:var(--text-3);margin-top:2px}
.podium .p .medal{font-size:22px;line-height:1}
.podium .first{background:linear-gradient(180deg,#fef3c7,#fde68a);border-color:#f59e0b;transform:scale(1.05)}
[data-theme=dark] .podium .first{background:linear-gradient(180deg,#451a03,#78350f);border-color:#f59e0b}
.podium .second{background:linear-gradient(180deg,#f1f5f9,#e2e8f0)}
[data-theme=dark] .podium .second{background:linear-gradient(180deg,#1e293b,#334155)}
.podium .third{background:linear-gradient(180deg,#fed7aa,#fdba74)}
[data-theme=dark] .podium .third{background:linear-gradient(180deg,#431407,#7c2d12)}

.rank-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px}
.rank-row:last-child{border-bottom:none}
.rank-row .pos{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.rank-row .pos.g1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.rank-row .pos.g2{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff}
.rank-row .pos.g3{background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff}
.rank-row .nm{flex:1;font-weight:600}
.rank-row .bar{flex:1;height:8px;background:var(--surface-2);border-radius:20px;overflow:hidden;max-width:180px}
.rank-row .bar .fill{height:100%;background:var(--primary)}
.rank-row .pct{min-width:44px;text-align:left;font-weight:700;font-size:12px;color:var(--primary)}

.modal{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);animation:fade .2s ease}
.modal.open{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal .box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.modal .box.wide{max-width:900px}
.modal .box.small{max-width:420px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
.modal-head h3 i{color:var(--primary)}
.close-x{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);background:var(--surface-2);transition:all var(--tr)}
.close-x:hover{background:var(--bad-soft);color:var(--bad)}

.q-card{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;background:var(--surface-2)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.q-opt{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.q-opt input[type=text]{flex:1}
.q-opt input[type=radio],.q-opt input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);flex-shrink:0;cursor:pointer}
.q-opt .del{width:26px;height:26px;border-radius:6px;background:var(--bad-soft);color:var(--bad);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.q-opt .del:hover{background:var(--bad);color:#fff}

.toasts{position:fixed;bottom:20px;left:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);font-size:13.5px;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.t-ok{border-right:4px solid var(--ok)}.toast.t-err{border-right:4px solid var(--bad)}
.toast.t-warn{border-right:4px solid var(--warn)}.toast.t-info{border-right:4px solid var(--info)}

.bc-mini{display:inline-block;width:76px;height:32px;background:#fff;border:1px solid var(--border);border-radius:4px;padding:2px;vertical-align:middle}
.bc-mini svg{width:100%;height:100%;display:block}
.bc-box{background:#fff;padding:14px;border-radius:8px;text-align:center;border:1px solid var(--border)}
.bc-box svg{max-width:100%;height:auto;display:block;margin:0 auto}

.auth-wrap{max-width:440px;margin:40px auto}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px 28px;box-shadow:var(--shadow)}
.auth-icon{width:56px;height:56px;border-radius:14px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 14px}
.auth-title{text-align:center;font-size:22px;margin-bottom:6px}
.auth-sub{text-align:center;color:var(--text-3);font-size:13px;margin-bottom:20px}

.hero{text-align:center;padding:40px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:20px}
.hero .logo{width:68px;height:68px;border-radius:18px;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px}
.hero h1{font-size:30px;margin-bottom:8px}
.hero p{color:var(--text-2);max-width:520px;margin:0 auto 22px;font-size:14.5px}
.hero .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

@media(max-width:900px){
  .sidebar{position:fixed;right:0;top:0;height:100vh;z-index:1000;transform:translateX(100%);transition:transform var(--tr);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:inline-flex}
  .content{padding:16px}
  .topbar{padding:12px 16px}
}
@media(max-width:600px){
  .page-title{font-size:15px}
  .card{padding:14px}
  .form-row > *{flex-basis:100%}
  .chart{height:130px}
  .auth-card{padding:22px 18px}
  .modal .box{padding:16px}
  .podium{grid-template-columns:1fr}
  .podium .first{transform:none}
}
</style>
</head>
<body>

<div id="backdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;" onclick="window.closeSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><i class="fas fa-shield-alt"></i><span>لوحة الأدمن</span></div>
    <div class="side-user" id="sideUser"></div>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-foot">
      <button class="icon-btn theme-toggle" onclick="window.toggleTheme()">
        <i class="fas fa-moon"></i><span>الوضع الليلي</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="page-title" id="pageTitle"><i class="fas fa-home"></i> <span>الرئيسية</span></div>
      <div class="top-actions">
        <button class="icon-btn menu-btn" onclick="window.openSidebar()"><i class="fas fa-bars"></i></button>
      </div>
    </div>
    <main class="content" id="app">
      <div class="center muted" style="padding:60px 0;"><i class="fas fa-spinner fa-spin"></i> جارِ الاتصال بقاعدة البيانات...</div>
    </main>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<!-- MODALS -->
<div class="modal" id="mScan"><div class="box small">
  <div class="modal-head"><h3><i class="fas fa-barcode"></i> مسح الباركود</h3><button class="close-x" onclick="window.closeScan()"><i class="fas fa-times"></i></button></div>
  <div style="border-radius:8px;overflow:hidden;border:2px solid var(--primary);background:#000;"><video id="barcodeVideo" autoplay playsinline muted style="width:100%;display:block;"></video></div>
  <p class="muted center" style="margin-top:10px"><i class="fas fa-info-circle"></i> وجّه الكاميرا نحو الباركود</p>
  <div id="barcodeResult" style="margin-top:10px"></div>
</div></div>

<div class="modal" id="mBarcodeView"><div class="box small">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* ============ FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDN_oCsbmOxEfIH_D6Vju1AZK3pkpQr-DY",
  authDomain: "school-system-manager-91675.firebaseapp.com",
  projectId: "school-system-manager-91675",
  storageBucket: "school-system-manager-91675.firebasestorage.app",
  messagingSenderId: "337434904928",
  appId: "1:337434904928:web:a083a8fceff11a2f51f605",
  measurementId: "G-JNWZ745V4J"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const DOC_REF = doc(db, "school-management", "data");

/* ============ STATE ============ */
let DATA = {};
let me = null;
let route = 'home';
let theme = localStorage.getItem('theme_admin') || 'light';
let confirmCb = null;
let scanStream = null, scanDetector = null, scanning = false;
let saving = false;
let pollTimer = null;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (p='') => p + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const today = () => new Date().toISOString().slice(0,10);
const nowIso = () => new Date().toISOString();

async function hash(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
function genCode(len=8){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code;
  do {
    code = Array.from({length:len}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
  } while (DATA.users?.some(u=>u.code===code) || DATA.students?.some(s=>s.code===code) || DATA.exams?.some(e=>e.code===code));
  return code;
}
function toast(msg, type='info'){
  const t = document.createElement('div');
  t.className = 'toast t-' + (type==='success'?'ok':type==='error'?'err':type==='warning'?'warn':'info');
  const ic = {success:'check-circle',error:'exclamation-circle',warning:'exclamation-triangle',info:'info-circle'}[type]||'info-circle';
  t.innerHTML = `<i class="fas fa-${ic}"></i><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(-20px)'; setTimeout(()=>t.remove(),300); }, 3200);
}
function openModal(id){ document.getElementById(id)?.classList.add('open'); }
function closeModal(id){ document.getElementById(id)?.classList.remove('open'); }

/* ============ SCHEMA / MIGRATE ============ */
const SCHEMA_VERSION = 3;
const DEFAULT_DB = () => ({
  meta: { version: SCHEMA_VERSION, createdAt: nowIso(), lastUpdate: nowIso(), schoolName: 'مدرستي' },
  users: [], classes: [], sections: [], students: [], subjects: [],
  attendance: [], grades: [], exams: [], examResults: [], notes: []
});
function migrate(d){
  if (!d.meta) d.meta = {};
  if (!d.meta.version) d.meta.version = 1;
  ['users','classes','sections','students','subjects','attendance','grades','exams','examResults','notes']
    .forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  d.users = d.users.map(u => ({ ...u, role: u.role || 'teacher', isActive: u.isActive === true, rejected: u.rejected === true, code: u.code || '', sectionIds: u.sectionIds || [], subjectIds: u.subjectIds || [], rank: u.rank || '' }));
  d.exams = d.exams.map(e => ({
    ...e,
    questions: Array.isArray(e.questions) ? e.questions.map(q => ({ id: q.id || uid('q_'), text: q.text || '', type: q.type || 'single', points: Number(q.points) || 1, options: Array.isArray(q.options) ? q.options : [], correct: q.correct || '', modelAnswer: q.modelAnswer || '' })) : [],
    totalPoints: Number(e.totalPoints) || 0,
    status: e.status || 'active', visible: e.visible !== false, shuffle: e.shuffle === true,
    attempts: Number(e.attempts) || 1, duration: Number(e.duration) || 30, code: e.code || ''
  }));
  d.examResults = d.examResults.map(r => ({ ...r, answers: r.answers || {}, score: Number(r.score) || 0, max: Number(r.max) || 0, attempt: Number(r.attempt) || 1, status: r.status || 'completed' }));
  d.meta.version = SCHEMA_VERSION;
  return d;
}
async function loadData(){
  try {
    const snap = await getDoc(DOC_REF);
    if (snap.exists()) {
      const raw = snap.data();
      DATA = raw.payload || raw;
    } else {
      DATA = DEFAULT_DB();
      await setDoc(DOC_REF, { payload: DATA });
    }
    DATA = migrate(DATA);
  } catch(e) {
    console.error(e);
    toast('تعذر الاتصال', 'error');
    DATA = migrate(DEFAULT_DB());
  }
}
async function saveData(){
  if (saving) return false;
  saving = true;
  try {
    DATA.meta.lastUpdate = nowIso();
    await setDoc(DOC_REF, { payload: DATA });
    return true;
  } catch(e) { console.error(e); toast('فشل الحفظ', 'error'); return false; }
  finally { saving = false; }
}
function startPolling(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (saving || document.hidden) return;
    try {
      const snap = await getDoc(DOC_REF);
      if (snap.exists()) {
        const raw = snap.data();
        const incoming = migrate(raw.payload || raw);
        if (incoming.meta.lastUpdate !== DATA.meta.lastUpdate) { DATA = incoming; render(); }
      }
    } catch(e){}
  }, 30000);
}

/* ============ SESSION ============ */
function saveMe(u){ localStorage.setItem('me_admin', JSON.stringify(u)); }
function loadMe(){ try { return JSON.parse(localStorage.getItem('me_admin')||'null'); } catch(e){ return null; } }
function clearMe(){ localStorage.removeItem('me_admin'); }

function applyTheme(t){
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  localStorage.setItem('theme_admin', t);
  const ico = $('.theme-toggle i'); if (ico) ico.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}
function toggleTheme(){ applyTheme(theme === 'light' ? 'dark' : 'light'); }
function openSidebar(){ $('#sidebar').classList.add('open'); $('#backdrop').style.display = 'block'; }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#backdrop').style.display = 'none'; }
function go(r, param=null){ route = r; render(); closeSidebar(); window.scrollTo({top:0, behavior:'smooth'}); }

/* ============ BARCODE ============ */
function barcodeSVG(code, opts={}){
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.style.background = '#fff';
  try {
    JsBarcode(svg, (code||'').toUpperCase().trim(), {format:'CODE128', width:2, height:(opts.h||60), displayValue:true, fontSize:12, font:'monospace', fontOptions:'bold', textMargin:3, margin:6, background:'#fff', lineColor:'#000'});
    const bb = svg.getBBox();
    if (bb.width && bb.height) svg.setAttribute('viewBox', `0 0 ${Math.ceil(bb.width)} ${Math.ceil(bb.height)}`);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('width','100%'); svg.setAttribute('height','100%'); svg.style.display = 'block';
    return svg.outerHTML;
  } catch(e) {
    return `<div style="text-align:center;font-family:monospace;font-size:11px;padding:8px;">${esc(code)}</div>`;
  }
}
window.viewBarcode = function(kind, id){
  const item = kind === 'student' ? DATA.students.find(s=>s.id===id) : DATA.users.find(u=>u.id===id);
  if (!item) return;
  const svg = barcodeSVG(item.code, {h:70});
  let extra = '';
  if (kind==='student') {
    const cls = DATA.classes.find(c=>c.id===item.classId);
    const sec = DATA.sections.find(s=>s.id===item.sectionId);
    extra = `${cls?.name||''} ${sec?('— '+sec.name):''}`;
  } else {
    extra = item.rank || (item.role==='admin'?'أدمن':'معلم');
  }
  $('#barcodeViewContent').innerHTML = `
    <div class="bc-box" style="margin-bottom:10px">${svg}</div>
    <div style="font-weight:700;text-align:center;">${esc(item.name)}</div>
    <div class="muted center" style="margin-bottom:12px">${esc(extra)}</div>
    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" onclick="window.downloadBarcode('${esc(item.code)}')"><i class="fas fa-download"></i> تحميل PNG</button>
      <button class="btn btn-secondary btn-sm" onclick="window.copyText('${esc(item.code)}',this)"><i class="fas fa-copy"></i> نسخ</button>
    </div>`;
  openModal('mBarcodeView');
};
window.downloadBarcode = function(code){
  const c = document.createElement('canvas');
  try {
    JsBarcode(c, (code||'').toUpperCase(), {format:'CODE128', width:4, height:150, displayValue:true, fontSize:24, font:'monospace', fontOptions:'bold', textMargin:8, margin:18, background:'#fff', lineColor:'#000'});
    c.toBlob(b => {
      if (!b) return toast('فشل', 'error');
      const url = URL.createObjectURL(b);
      const a = document.createElement('a'); a.href = url; a.download = `barcode-${code}.png`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1200);
      toast('تم التحميل', 'success');
    }, 'image/png');
  } catch(e) { toast('فشل', 'error'); }
};
window.copyText = function(text, btn){
  const done = () => { if (btn) { const o = btn.innerHTML; btn.innerHTML = '<i class="fas fa-check"></i>'; setTimeout(()=>btn.innerHTML=o, 1000); } toast('تم النسخ', 'success'); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(done);
  else { const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e){} document.body.removeChild(ta); done(); }
};

/* ============ SCAN ============ */
window.startScan = async function(){
  openModal('mScan'); $('#barcodeResult').innerHTML = '';
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    $('#barcodeVideo').srcObject = scanStream;
    scanning = true;
    if ('BarcodeDetector' in window) {
      scanDetector = new BarcodeDetector({ formats: ['code_128','code_39','ean_13','ean_8','qr_code','codabar','itf','upc_a','upc_e'] });
      loopScan();
    } else {
      $('#barcodeResult').innerHTML = '<div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i> المتصفح لا يدعم المسح.</div>';
    }
  } catch(e) { $('#barcodeResult').innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> لا يمكن الوصول للكاميرا.</div>'; }
};
async function loopScan(){
  const video = $('#barcodeVideo');
  if (!scanning || !scanDetector) return;
  try {
    const hits = await scanDetector.detect(video);
    if (hits.length) {
      const code = hits[0].rawValue.trim().toUpperCase();
      scanning = false;
      if (scanStream) { scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
      $('#barcodeResult').innerHTML = `<div class="alert alert-success"><i class="fas fa-check"></i> تم مسح: <strong>${esc(code)}</strong></div>`;
      setTimeout(() => { closeModal('mScan'); onScanned(code); }, 600);
      return;
    }
  } catch(e){}
  requestAnimationFrame(loopScan);
}
window.closeScan = function(){
  scanning = false;
  if (scanStream) { scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
  scanDetector = null;
  closeModal('mScan');
};
function onScanned(code){
  const student = DATA.students.find(s=>s.code===code);
  if (student) return markAttendance(student.id, 'حاضر');
  const user = DATA.users.find(u=>u.code===code);
  if (user) return toast(`تم مسح: ${user.name}`, 'info');
  const exam = DATA.exams.find(e=>e.code===code);
  if (exam) return toast(`كود اختبار: ${exam.name}`, 'info');
  toast('كود غير معروف', 'error');
}

async function markAttendance(studentId, status, note=''){
  const st = DATA.students.find(s=>s.id===studentId);
  if (!st) return;
  const ex = DATA.attendance.find(a => a.targetType==='student' && a.targetId===studentId && a.date===today());
  if (ex) { ex.status = status; ex.note = note || ex.note || ''; }
  else DATA.attendance.push({ id: uid('att_'), targetType:'student', targetId: studentId, date: today(), status, note, by: me.id, at: nowIso() });
  await saveData();
  toast(`تم "${status}" لـ ${st.name}`, 'success');
  render();
}
window.markAttendance = markAttendance;

window.askConfirm = function(msg, cb){ $('#confirmMsg').textContent = msg; confirmCb = cb; openModal('mConfirm'); };
window.confirmYes = function(){ const cb = confirmCb; confirmCb = null; closeModal('mConfirm'); if (cb) cb(); };

}

function viewLogin(){
  return `<div class="auth-wrap"><div class="auth-card">
    <div class="auth-icon"><i class="fas fa-shield-alt"></i></div>
    <div class="auth-title">دخول الأدمن</div>
    <div class="auth-sub">هذه الصفحة مخصصة لمدير النظام</div>
    <div id="loginMsg"></div>
    <form class="form" onsubmit="return window.doLogin(event)">
      <div class="field"><label>اسم المستخدم</label><input class="input" name="username" required /></div>
      <div class="field"><label>كلمة المرور</label><input class="input" type="password" name="password" required /></div>
      <button class="btn btn-primary btn-block" type="submit"><i class="fas fa-sign-in-alt"></i> دخول</button>
    </form>
  </div></div>`;
}
window.doLogin = async function(ev){
  ev.preventDefault();
  const f = ev.target;
  const username = f.username.value.trim(), password = f.password.value;
  const msg = $('#loginMsg');
  const u = DATA.users.find(x => x.username === username);
  if (!u) { msg.innerHTML = '<div class="alert alert-error"><i class="fas fa-times-circle"></i> بيانات غير صحيحة.</div>'; return false; }
  const h = await hash(password);
  if (u.passwordHash !== h) { msg.innerHTML = '<div class="alert alert-error"><i class="fas fa-times-circle"></i> بيانات غير صحيحة.</div>'; return false; }
  if (u.role !== 'admin') { msg.innerHTML = '<div class="alert alert-error"><i class="fas fa-times-circle"></i> هذا الحساب ليس أدمن.</div>'; return false; }
  if (!u.isActive) { msg.innerHTML = '<div class="alert alert-error"><i class="fas fa-ban"></i> الحساب موقوف.</div>'; return false; }
  me = { id: u.id, name: u.name, username: u.username, role: 'admin' };
  saveMe(me);
  toast('تم الدخول', 'success');
  go('dashboard');
  return false;
};

window.approveUser = async function(id){
  const u = DATA.users.find(x=>x.id===id); if (!u) return;
  const secIds = [...(document.getElementById('pSec_'+id)?.selectedOptions||[])].map(o=>o.value);
  const subIds = [...(document.getElementById('pSub_'+id)?.selectedOptions||[])].map(o=>o.value);
  if (!secIds.length && !subIds.length) return toast('اختر فصلاً أو مادة', 'warning');
  u.isActive = true; u.rejected = false; u.sectionIds = secIds; u.subjectIds = subIds;
  u.rank = document.getElementById('pRank_'+id)?.value.trim() || '';
  await saveData();
  toast(`تم تفعيل ${u.name}`, 'success');
  render();
};
window.rejectUser = async function(id){
  const u = DATA.users.find(x=>x.id===id); if (!u) return;
  askConfirm(`رفض وحذف "${u.name}"؟`, async () => { DATA.users = DATA.users.filter(x=>x.id!==id); await saveData(); render(); });
};

};
window.suspendUser = function(id){
  const u = DATA.users.find(x=>x.id===id); if (!u) return;
  askConfirm(`إيقاف "${u.name}"؟`, async () => { u.isActive = false; await saveData(); render(); });
};
window.editUser = function(id){
  const u = DATA.users.find(x=>x.id===id); if (!u) return;
  const name = prompt('الاسم:', u.name); if (name === null) return;
  const rank = prompt('الرتبة:', u.rank || ''); if (rank === null) return;
  u.name = name.trim() || u.name; u.rank = rank.trim();
  saveData().then(()=>{ toast('تم', 'success'); render(); });

window.addClass = async function(ev){
  ev.preventDefault();
  const f = ev.target;
  const name = f.name.value.trim();
  const order = parseInt(f.order.value) || DATA.classes.length+1;
  if (!name) return false;
  if (DATA.classes.some(c=>c.name===name)) return toast('الصف موجود', 'warning'), false;
  DATA.classes.push({ id: uid('c_'), name, order, createdAt: nowIso() });
  await saveData(); toast('تمت', 'success'); render(); return false;
};
window.editClass = function(id){
  const c = DATA.classes.find(x=>x.id===id); if (!c) return;
  const name = prompt('اسم الصف:', c.name); if (name === null) return;
  const order = prompt('الترتيب:', c.order); if (order === null) return;
  c.name = name.trim() || c.name; c.order = parseInt(order) || c.order;
  saveData().then(()=>{ toast('تم التعديل', 'success'); render(); });
};
window.addSection = async function(classId){
  const name = prompt('اسم الفصل:'); if (!name) return;
  DATA.sections.push({ id: uid('s_'), classId, name: name.trim(), createdAt: nowIso() });
  await saveData(); toast('تمت', 'success'); render();
};
window.editSection = function(id){
  const s = DATA.sections.find(x=>x.id===id); if (!s) return;
  const name = prompt('اسم الفصل:', s.name); if (name === null) return;
  s.name = name.trim() || s.name;
  saveData().then(()=>{ toast('تم', 'success'); render(); });
};
window.deleteClass = function(id){
  const c = DATA.classes.find(x=>x.id===id); if (!c) return;
  askConfirm(`حذف "${c.name}" وكل فصوله وطلابه؟`, async () => {
    DATA.sections = DATA.sections.filter(s=>s.classId!==id);
    DATA.students = DATA.students.filter(s=>s.classId!==id);
    DATA.classes = DATA.classes.filter(x=>x.id!==id);
    await saveData(); toast('تم', 'success'); render();
  });
};
window.deleteSection = function(id){
  askConfirm('حذف الفصل؟', async () => {
    DATA.sections = DATA.sections.filter(s=>s.id!==id);
    DATA.students = DATA.students.filter(s=>s.sectionId!==id);
    await saveData(); toast('تم', 'success'); render();
  });
};

window.loadFormSections = function(cid){
  const sel = $('#formSection'); if (!sel) return;
  sel.innerHTML = `<option value="">اختر</option>${DATA.sections.filter(s=>s.classId===cid).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}`;
};
window.addStudent = async function(ev){
  ev.preventDefault();
  const f = ev.target;
  const name = f.name.value.trim(), classId = f.classId.value, sectionId = f.sectionId.value;
  if (!name || !classId || !sectionId) return toast('أكمل', 'warning'), false;
  const code = genCode(8);
  DATA.students.push({ id: uid('st_'), name, classId, sectionId, code, createdAt: nowIso() });
  await saveData(); toast(`تمت الإضافة — الكود: ${code}`, 'success'); render(); return false;
};
window.editStudent = function(id){
  const s = DATA.students.find(x=>x.id===id); if (!s) return;
  const name = prompt('اسم الطالب:', s.name); if (name === null) return;
  s.name = name.trim() || s.name;
  saveData().then(()=>{ toast('تم', 'success'); render(); });
};
window.deleteStudent = function(id){
  const s = DATA.students.find(x=>x.id===id);
  askConfirm(`حذف "${s?.name}"؟`, async () => {
    DATA.students = DATA.students.filter(x=>x.id!==id);
    DATA.attendance = DATA.attendance.filter(a=>a.targetId!==id);
    DATA.grades = DATA.grades.filter(g=>g.studentId!==id);
    DATA.examResults = DATA.examResults.filter(r=>r.studentId!==id);
    await saveData(); toast('تم', 'success'); render();
  });
};

function addQuestionFromData(q){
  const div = document.createElement('div');
  div.className = 'q-card';
  const type = q.type || 'single';
  div.innerHTML = `
    <div class="q-head"><strong style="font-size:13px">سؤال</strong><button type="button" class="btn btn-danger btn-xs" onclick="this.closest('.q-card').remove()"><i class="fas fa-trash"></i></button></div>

        <option value="single" ${type==='single'?'selected':''}>اختيار واحد</option>
        <option value="multiple" ${type==='multiple'?'selected':''}>اختيار متعدد</option>
        <option value="truefalse" ${type==='truefalse'?'selected':''}>صح/خطأ</option>
        <option value="essay" ${type==='essay'?'selected':''}>مقالي</option>
        <option value="complete" ${type==='complete'?'selected':''}>أكمل</option>
      </select></div>
      <div class="field"><label>الدرجة</label><input class="input q-points" type="number" value="${q.points}" min="1" /></div>
    </div>

  $('#questionsBox').appendChild(div);

  (q.options||[]).forEach(opt => {
    const item = document.createElement('div');
    item.className = 'q-opt';
    item.innerHTML = `<input type="${type==='multiple'?'checkbox':'radio'}" name="c_${uid()}" value="${esc(opt)}" ${correct.includes(opt)?'checked':''} /><input class="input" type="text" value="${esc(opt)}" /><button type="button" class="del" onclick="this.closest('.q-opt').remove()"><i class="fas fa-times"></i></button>`;
    optsBox.appendChild(item);
  });
  if (q.modelAnswer) div.querySelector('.q-model').value = q.modelAnswer;
  if (type==='essay'||type==='complete') { div.querySelector('.q-opts-box').style.display='none'; div.querySelector('.q-model-box').style.display='block'; }
}
window.changeQType = function(sel){
  const card = sel.closest('.q-card');
  const type = sel.value;
  const optsBox = card.querySelector('.q-opts-box');
  const modelBox = card.querySelector('.q-model-box');
  const opts = card.querySelector('.q-opts');
  if (type === 'essay' || type === 'complete') { optsBox.style.display = 'none'; modelBox.style.display = 'block'; return; }
  optsBox.style.display = 'block';
  modelBox.style.display = 'none';
  if (type === 'truefalse') {
    opts.innerHTML = '';
    ['صح','خطأ'].forEach(t => {
      const item = document.createElement('div');
      item.className = 'q-opt';
      item.innerHTML = `<input type="radio" name="tf_${uid()}" value="${t}" /><input class="input" type="text" value="${t}" readonly />`;
      opts.appendChild(item);
    });
  }
};
window.addOpt = function(btn){
  const card = btn.closest('.q-card');
  const type = card.querySelector('.q-type').value;
  if (type !== 'single' && type !== 'multiple') return toast('غير متاح', 'warning');
  const opts = card.querySelector('.q-opts');
  const item = document.createElement('div');
  item.className = 'q-opt';
  item.innerHTML = `<input type="${type==='multiple'?'checkbox':'radio'}" name="c_${uid()}" /><input class="input" type="text" placeholder="خيار جديد" /><button type="button" class="del" onclick="this.closest('.q-opt').remove()"><i class="fas fa-times"></i></button>`;
  opts.appendChild(item);
};
window.saveExam = async function(ev){
  ev.preventDefault();
  const id = $('#examId').value;
  const name = $('#examName').value.trim();
  const classId = $('#examClass').value;
  if (!name || !classId) return toast('أكمل الحقول', 'warning'), false;
  const questions = [];
  let valid = true;
  $$('#questionsBox .q-card').forEach((card, i) => {
    const text = card.querySelector('.q-text').value.trim();
    const type = card.querySelector('.q-type').value;
    const points = Math.max(1, +card.querySelector('.q-points').value || 1);
    let options = [], correct = '', modelAnswer = '';
    if (type==='single'||type==='multiple'||type==='truefalse') {
      options = [...card.querySelectorAll('.q-opt input[type=text]')].map(inp=>inp.value.trim()).filter(Boolean);
      correct = [...card.querySelectorAll('.q-opt input[type=radio]:checked, .q-opt input[type=checkbox]:checked')].map(r=>r.value.trim()).filter(Boolean).join(',');
    } else { modelAnswer = card.querySelector('.q-model').value.trim(); }
    if (!text) { valid = false; toast(`السؤال ${i+1}: النص مطلوب`, 'warning'); return; }
    if ((type==='single'||type==='multiple') && options.length < 2) { valid = false; toast(`السؤال ${i+1}: خياران على الأقل`, 'warning'); return; }
    if ((type==='single'||type==='truefalse') && !correct) { valid = false; toast(`السؤال ${i+1}: حدد الإجابة`, 'warning'); return; }
    questions.push({ id: uid('q_'), text, type, points, options, correct, modelAnswer });
  });
  if (!valid) return false;
  if (questions.length === 0) return toast('أضف سؤالاً', 'warning'), false;
  const data = {
    name, description: $('#examDescription').value.trim(),
    duration: Math.max(1, +$('#examDuration').value || 30),
    attempts: Math.max(1, +$('#examAttempts').value || 1),
    classId, sectionId: $('#examSection').value || null,
    subjectId: $('#examSubject').value || null, status: $('#examStatus').value,
    startTime: $('#examStart').value || null, endTime: $('#examEnd').value || null,
    shuffle: $('#examShuffle').checked, visible: $('#examVisible').checked,
    questions, totalPoints: questions.reduce((s,q)=>s+q.points,0),
    teacherId: me.id
  };
  if (id) {
    const ex = DATA.exams.find(e=>e.id===id);
    if (!ex) return toast('غير موجود', 'error'), false;
    Object.assign(ex, data);
  } else {
    DATA.exams.push({ id: uid('ex_'), code: genCode(8), ...data, createdAt: nowIso() });
  }
  await saveData();
  toast('تم الحفظ', 'success');
  closeModal('mExam');
  render();
  return false;
};
window.deleteExam = function(id){
  askConfirm('حذف الاختبار؟', async () => {
    DATA.exams = DATA.exams.filter(e=>e.id!==id);
    DATA.examResults = DATA.examResults.filter(r=>r.examId!==id);
    await saveData(); render();
  });
};

/* ============ NOTES ============ */
let noteQ = '';
function viewNotes(){
  let list = DATA.notes.slice().reverse();
  if (noteQ) { const q = noteQ.toLowerCase(); list = list.filter(n => n.text.toLowerCase().includes(q)); }
  return `<div class="container">
    <div class="card" style="margin-bottom:14px">
      <div class="card-head"><h3><i class="fas fa-plus-circle"></i> إضافة ملاحظة</h3></div>
      <form class="form-row" onsubmit="return window.addNote(event)">
        <div class="field" style="flex:3"><label>الملاحظة</label><input class="input" name="text" required /></div>
        <div class="field" style="flex:2"><label>الطالب (اختياري)</label><select class="input" name="studentId"><option value="">عامة</option>${DATA.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
        <div class="field" style="flex:0 0 auto;align-self:flex-end"><button class="btn btn-primary" type="submit"><i class="fas fa-plus"></i></button></div>
      </form>
    </div>
    <div class="toolbar">
      <div class="search-wrap"><i class="fas fa-search"></i><input class="input" placeholder="ابحث في الملاحظات..." value="${esc(noteQ)}" oninput="window.debounceSet('noteQ', this.value)" /></div>
    </div>
    <div class="card">
      ${list.length===0 ? '<div class="empty"><i class="fas fa-sticky-note"></i><div>لا ملاحظات</div></div>' : `
      <div>${list.map(n => {
        const st = n.studentId ? DATA.students.find(s=>s.id===n.studentId) : null;
        return `<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap">
          <span>${st?`<span class="badge badge-info">${esc(st.name)}</span> `:''}${esc(n.text)}</span>
          <div class="actions">
            <button class="btn btn-warn btn-xs" onclick="window.editNote('${n.id}')"><i class="fas fa-edit"></i></button>
            <button class="btn btn-danger btn-xs" onclick="window.deleteNote('${n.id}')"><i class="fas fa-times"></i></button>
          </div>
        </div>`;
      }).join('')}</div>`}
    </div>
  </div>`;
}
window.addNote = async function(ev){
  ev.preventDefault();
  const f = ev.target;
  DATA.notes.push({ id: uid('n_'), text: f.text.value.trim(), studentId: f.studentId.value || null, date: nowIso(), by: me.id });
  await saveData(); render(); return false;
};
window.editNote = function(id){
  const n = DATA.notes.find(x=>x.id===id); if (!n) return;
  const text = prompt('الملاحظة:', n.text); if (text === null) return;
  n.text = text.trim() || n.text;
  saveData().then(()=>{ toast('تم', 'success'); render(); });
};
window.deleteNote = function(id){
  askConfirm('حذف؟', async () => { DATA.notes = DATA.notes.filter(n=>n.id!==id); await saveData(); render(); });
};

/* ============ ANALYTICS ============ */
function viewAnalytics(){
  const weeksMap = {};
  DATA.attendance.filter(a=>a.targetType==='student').forEach(a => { if (!weeksMap[a.date]) weeksMap[a.date] = {p:0, ab:0}; if (a.status==='حاضر') weeksMap[a.date].p++; else weeksMap[a.date].ab++; });
  const weeks = Object.keys(weeksMap).sort().slice(-14);
  const maxW = Math.max(1, ...weeks.map(w=>weeksMap[w].p + weeksMap[w].ab));
  const classDist = DATA.classes.map(c => ({ name: c.name, count: DATA.students.filter(s=>s.classId===c.id).length })).sort((a,b)=>b.count-a.count);
  const totalAtt = DATA.attendance.filter(a=>a.targetType==='student').length;
  const present = DATA.attendance.filter(a=>a.targetType==='student'&&a.status==='حاضر').length;
  const pct = totalAtt ? Math.round(present/totalAtt*100) : 0;
  const avgGrade = DATA.grades.length ? Math.round(DATA.grades.reduce((s,g)=>s + (g.max?(g.score/g.max)*100:0), 0) / DATA.grades.length) : 0;
  return `<div class="container">
    <div class="stats" style="margin-bottom:16px">
      <div class="stat"><div class="ico" style="background:var(--primary-soft);color:var(--primary)"><i class="fas fa-child"></i></div><div><div class="num">${DATA.students.length}</div><div class="lbl">الطلاب</div></div></div>
      <div class="stat"><div class="ico" style="background:var(--info-soft);color:var(--info)"><i class="fas fa-clipboard-list"></i></div><div><div class="num">${totalAtt}</div><div class="lbl">سجلات</div></div></div>
      <div class="stat"><div class="ico" style="background:var(--ok-soft);color:var(--ok)"><i class="fas fa-check-circle"></i></div><div><div class="num">${present}</div><div class="lbl">حضور</div></div></div>
      <div class="stat"><div class="ico" style="background:var(--bad-soft);color:var(--bad)"><i class="fas fa-times-circle"></i></div><div><div class="num">${totalAtt-present}</div><div class="lbl">غياب</div></div></div>
      <div class="stat"><div class="ico" style="background:var(--warn-soft);color:var(--warn)"><i class="fas fa-percentage"></i></div><div><div class="num">${pct}%</div><div class="lbl">نسبة الحضور</div></div></div>
      <div class="stat"><div class="ico" style="background:var(--gold-soft);color:var(--gold)"><i class="fas fa-star"></i></div><div><div class="num">${avgGrade}%</div><div class="lbl">متوسط الدرجات</div></div></div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="card-head"><h3><i class="fas fa-chart-bar"></i> الحضور اليومي (آخر 14 يوم)</h3></div>
      ${weeks.length===0 ? '<div class="empty">لا بيانات</div>' : `
      <div class="chart">
        ${weeks.map(w => { const tot = weeksMap[w].p + weeksMap[w].ab; const h = tot > 0 ? (tot/maxW)*100 : 0; return `<div class="bar" style="height:${Math.max(h,4)}%" title="${w}: ${weeksMap[w].p} حاضر، ${weeksMap[w].ab} غائب"><span class="v">${tot}</span><span class="l">${w.slice(5)}</span></div>`; }).join('')}
      </div>`}
    </div>
    <div class="card">
      <div class="card-head"><h3><i class="fas fa-layer-group"></i> توزيع الطلاب</h3></div>
      ${classDist.length===0 ? '<div class="empty">لا بيانات</div>' : classDist.map(c => { const p = DATA.students.length ? Math.round(c.count/DATA.students.length*100) : 0; return `<div class="bar-row"><div class="n">${esc(c.name)}</div><div class="track"><div class="fill" style="width:${p}%">${p}%</div></div><div class="v">${c.count}</div></div>`; }).join('')}
    </div>
  </div>`;
}

/* ============ TOP STUDENTS ============ */
function computeStudentScore(st){
  const sAtt = DATA.attendance.filter(a=>a.targetType==='student' && a.targetId===st.id);
  const present = sAtt.filter(a=>a.status==='حاضر').length;
  const attPct = sAtt.length ? (present/sAtt.length)*100 : 0;
  const sGrades = DATA.grades.filter(g=>g.studentId===st.id);
  const avgGrade = sGrades.length ? sGrades.reduce((s,g)=>s + (g.max?(g.score/g.max)*100:0), 0) / sGrades.length : 0;
  const sResults = DATA.examResults.filter(r=>r.studentId===st.id && r.status==='completed');
  const avgExam = sResults.length ? sResults.reduce((s,r)=>s + (r.max?(r.score/r.max)*100:0), 0) / sResults.length : 0;
  const count = sAtt.length + sGrades.length + sResults.length;
  const score = count > 0 ? (attPct*0.4 + avgGrade*0.3 + avgExam*0.3) : 0;
  return { st, score, count };
}
function viewTopStudents(){
  return `<div class="container">
    <div class="card" style="margin-bottom:14px">
      <div class="card-head"><h3><i class="fas fa-trophy"></i> أفضل الطلاب</h3></div>
      <p class="muted">الحضور (40%) + الدرجات (30%) + الاختبارات (30%).</p>
    </div>
    ${DATA.classes.length===0 ? '<div class="card empty"><div>لا صفوف</div></div>' : DATA.classes.map(cls => {
      const students = DATA.students.filter(s=>s.classId===cls.id);
      if (!students.length) return '';
      const stats = students.map(computeStudentScore).filter(x => x.count > 0).sort((a,b) => b.score - a.score);
      if (!stats.length) return `<div class="card" style="margin-bottom:14px"><div class="card-head"><h3><i class="fas fa-layer-group"></i> ${esc(cls.name)}</h3></div><div class="empty">لا بيانات</div></div>`;
      const [first, second, third, ...rest] = stats;
      return `<div class="card" style="margin-bottom:14px">
        <div class="card-head"><h3><i class="fas fa-layer-group"></i> ${esc(cls.name)} <span class="muted">(${students.length} طالب)</span></h3></div>
        <div class="podium">
          ${second ? `<div class="p second"><div class="medal">🥈</div><div class="avatar" style="background:#64748b">${esc(second.st.name.charAt(0))}</div><div class="nm">${esc(second.st.name)}</div><div class="sc">${Math.round(second.score)}%</div></div>` : '<div></div>'}
          ${first ? `<div class="p first"><div class="medal">🥇</div><div class="avatar" style="background:#f59e0b">${esc(first.st.name.charAt(0))}</div><div class="nm">${esc(first.st.name)}</div><div class="sc">${Math.round(first.score)}%</div></div>` : ''}
          ${third ? `<div class="p third"><div class="medal">🥉</div><div class="avatar" style="background:#ea580c">${esc(third.st.name.charAt(0))}</div><div class="nm">${esc(third.st.name)}</div><div class="sc">${Math.round(third.score)}%</div></div>` : '<div></div>'}
        </div>
        ${rest.length ? `<div style="margin-top:14px">${rest.slice(0,15).map((x, i) => `<div class="rank-row"><div class="pos">${i+4}</div><div class="nm">${esc(x.st.name)}</div><div class="bar"><div class="fill" style="width:${Math.round(x.score)}%"></div></div><div class="pct">${Math.round(x.score)}%</div></div>`).join('')}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

/* ============ EXPORT / IMPORT ============ */
window.exportData = function(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `school-data-${today()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
  toast('تم التصدير', 'success');
};
window.openImport = () => openModal('mImport');
window.doImport = async function(){
  const txt = $('#importJson').value.trim(); if (!txt) return toast('أدخل JSON', 'warning');
  try {
    const parsed = JSON.parse(txt);
    if (!parsed || typeof parsed !== 'object') throw new Error('invalid');
    DATA = migrate(parsed); await saveData();
    toast('تم الاستيراد', 'success');
    closeModal('mImport'); render();
  } catch(e) { toast('JSON غير صالح', 'error'); }
};

window.logout = function(){ askConfirm('تسجيل الخروج؟', () => { me = null; clearMe(); go('home'); toast('تم', 'info'); }); };

let debounceTimers = {};
window.debounceSet = function(key, val){
  clearTimeout(debounceTimers[key]);
  debounceTimers[key] = setTimeout(() => {
    if (['sQ','attQ','gradeQ','examQ','noteQ','classQ','subQ'].includes(key)) window['__' + key] = val;
    render();
  }, 250);
};
Object.defineProperty(window, '__sQ', { set: v => { sQ = v; }, get: () => sQ });
Object.defineProperty(window, '__classQ', { set: v => { classQ = v; }, get: () => classQ });
Object.defineProperty(window, '__subQ', { set: v => { subQ = v; }, get: () => subQ });
Object.defineProperty(window, '__attQ', { set: v => { attQ = v; }, get: () => attQ });
Object.defineProperty(window, '__gradeQ', { set: v => { gradeQ = v; }, get: () => gradeQ });
Object.defineProperty(window, '__examQ', { set: v => { examQ = v; }, get: () => examQ });
Object.defineProperty(window, '__noteQ', { set: v => { noteQ = v; }, get: () => noteQ });

window.setFilter = function(key, val){
  if (key === 'sCF') sCF = val;
  else if (key === 'sSF') sSF = val;
  else if (key === 'attCF') attCF = val;
  else if (key === 'attSF') attSF = val;
  else if (key === 'attStat') attStat = val;
  render();
};

/* ============ RENDER ============ */
function render(){
  renderSidebar(); renderTopBar();
  const app = $('#app');
  const adminRoutes = ['dashboard','analytics','topStudents','pending','users','classes','students','subjects','attendance','grades','exams','notes'];
  if (!me || me.role !== 'admin') { if (adminRoutes.includes(route)) route = 'login'; }
  let html = '';
  switch(route){
    case 'home': html = viewHome(); break;
    case 'login': html = viewLogin(); break;
    case 'dashboard': html = viewDashboard(); break;
    case 'analytics': html = viewAnalytics(); break;
    case 'topStudents': html = viewTopStudents(); break;
    case 'pending': html = viewPending(); break;
    case 'users': html = viewUsers(); break;
    case 'classes': html = viewClasses(); break;
    case 'students': html = viewStudents(); break;
    case 'subjects': html = viewSubjects(); break;
    case 'attendance': html = viewAttendance(); break;
    case 'grades': html = viewGrades(); break;
    case 'exams': html = viewExams(); break;
    case 'notes': html = viewNotes(); break;
    default: html = viewHome();
  }
  app.innerHTML = html;
}

/* ============ INIT ============ */
(async function init(){
  applyTheme(theme);
  await loadData();
  const saved = loadMe();
  if (saved) {
    const u = DATA.users.find(x=>x.id===saved.id);
    if (u && u.role === 'admin' && u.isActive) { me = { id: u.id, name: u.name, username: u.username, role: 'admin' }; saveMe(me); if (route === 'home') route = 'dashboard'; }
    else { clearMe(); }
  }
  render();
  startPolling();
})();

Object.assign(window, {
  go, toggleTheme, openSidebar, closeSidebar,
  openModal, closeModal,
  startScan, closeScan, viewBarcode, downloadBarcode, copyText,
  askConfirm, confirmYes, markAttendance,
  openExam, saveExam, addQuestion, changeQType, addOpt, deleteExam, viewExamResults,
  exportData, openImport, doImport
});
</script>
