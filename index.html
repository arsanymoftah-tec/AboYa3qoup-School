<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة المعلم — منصة إدارة المدرسة</title>
<meta name="theme-color" content="#0f766e" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800;900&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f4f6f9;--surface:#fff;--surface-2:#f9fafb;--border:#e5e7eb;
  --text:#111827;--text-2:#4b5563;--text-3:#9ca3af;
  --primary:#0f766e;--primary-2:#0d9488;--primary-soft:#ccfbf1;
  --accent:#7c3aed;--accent-soft:#ede9fe;
  --ok:#059669;--ok-soft:#d1fae5;--bad:#dc2626;--bad-soft:#fee2e2;
  --warn:#d97706;--warn-soft:#fef3c7;--info:#2563eb;--info-soft:#dbeafe;
  --gold:#f59e0b;--gold-soft:#fef3c7;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);--shadow:0 2px 8px rgba(0,0,0,.06);--shadow-lg:0 8px 24px rgba(0,0,0,.08);
  --radius:12px;--radius-sm:8px;--radius-lg:16px;--sidebar-w:250px;--tr:150ms ease;
  --font-title:'Zain',system-ui,sans-serif;--font-body:'Almarai',system-ui,sans-serif;
}
[data-theme=dark]{--bg:#0b1220;--surface:#111a2e;--surface-2:#0f1728;--border:#1e293b;
  --text:#e5e7eb;--text-2:#94a3b8;--text-3:#64748b;--primary:#14b8a6;--primary-2:#2dd4bf;
  --primary-soft:#042f2e;--accent:#a78bfa;--accent-soft:#2e1065;
  --ok:#10b981;--ok-soft:#064e3b;--bad:#f87171;--bad-soft:#450a0a;
  --warn:#fbbf24;--warn-soft:#451a03;--info:#60a5fa;--info-soft:#1e3a8a;
  --gold:#fbbf24;--gold-soft:#451a03;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 2px 8px rgba(0,0,0,.5);--shadow-lg:0 8px 24px rgba(0,0,0,.6);}
html,body{height:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.7;transition:background var(--tr),color var(--tr);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,h6,.page-title,.brand,.hero h1,.auth-title{font-family:var(--font-title);font-weight:800;letter-spacing:-.3px}
button,input,select,textarea{font-family:var(--font-body);font-size:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary);text-decoration:none}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
.brand{display:flex;align-items:center;gap:10px;padding:18px;border-bottom:1px solid var(--border);font-size:17px}
.brand i{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;font-size:16px}
.side-user{padding:14px 18px;border-bottom:1px solid var(--border)}
.side-user .u-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.side-user .u-meta{font-size:12px;color:var(--text-3);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-3);padding:14px 12px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--text-2);text-decoration:none;font-size:13.5px;transition:all var(--tr);cursor:pointer}
.nav a i{width:18px;text-align:center;font-size:14px}
.nav a:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.nav a.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.side-foot{padding:12px 10px;border-top:1px solid var(--border)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);transition:all var(--tr)}
.icon-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.side-foot .theme-toggle{width:100%;justify-content:flex-start;gap:10px;padding:8px 12px;font-size:13px;height:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:40}
.page-title{font-size:18px;display:flex;align-items:center;gap:10px}
.page-title i{color:var(--primary)}
.top-actions{display:flex;gap:8px;align-items:center}
.menu-btn{display:none}
.content{padding:24px;flex:1}
.container{max-width:1280px;margin:0 auto;padding:0}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);transition:box-shadow var(--tr)}
.card:hover{box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.card-head h3{font-size:15px;display:flex;align-items:center;gap:8px;margin:0}
.card-head h3 i{color:var(--primary)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;transition:all var(--tr);border:1px solid transparent;white-space:nowrap;line-height:1.4;font-family:var(--font-body)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn i{font-size:13px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-2)}
.btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--border)}.btn-secondary:hover{background:var(--border)}
.btn-success{background:var(--ok);color:#fff}.btn-success:hover{filter:brightness(1.1)}
.btn-danger{background:var(--bad);color:#fff}.btn-danger:hover{filter:brightness(1.1)}
.btn-warn{background:var(--warn);color:#fff}.btn-warn:hover{filter:brightness(1.1)}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;color:var(--text-2)}.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.btn-xs{padding:3px 8px;font-size:11.5px;border-radius:6px}
.btn-block{width:100%}

.form{display:flex;flex-direction:column;gap:14px}
.form-row{display:flex;gap:12px;flex-wrap:wrap}
.form-row > *{flex:1 1 180px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-size:12.5px;font-weight:700;color:var(--text-2)}
.input,select.input,textarea.input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-family:var(--font-body);transition:border-color var(--tr),box-shadow var(--tr)}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input:disabled{background:var(--surface-2);color:var(--text-3);cursor:not-allowed}
textarea.input{min-height:80px;resize:vertical}
.check-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-2);cursor:pointer}
.check-row input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.toolbar .input{flex:1 1 180px;padding:7px 12px;font-size:13px}
.toolbar .search-wrap{position:relative;flex:1 1 220px}
.toolbar .search-wrap i{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.toolbar .search-wrap .input{padding-right:36px}

.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:11px 14px;text-align:right;vertical-align:middle;border-bottom:1px solid var(--border)}
th{background:var(--surface-2);font-size:11.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr{transition:background var(--tr)}
tbody tr:hover{background:var(--surface-2)}
td .actions{display:flex;gap:4px;flex-wrap:wrap}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;line-height:1.6}
.badge-ok{background:var(--ok-soft);color:var(--ok)}
.badge-bad{background:var(--bad-soft);color:var(--bad)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-primary{background:var(--primary-soft);color:var(--primary)}
.badge-gold{background:var(--gold-soft);color:var(--gold)}
.badge-accent{background:var(--accent-soft);color:var(--accent)}

.code-pill{display:inline-block;padding:2px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);font-family:'Courier New',monospace;font-size:12px;font-weight:700;letter-spacing:.5px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:14px;transition:all var(--tr)}
.stat:hover{box-shadow:var(--shadow);border-color:var(--primary-soft)}
.stat .ico{width:42px;height:42px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.stat .num{font-size:22px;font-weight:800;line-height:1.1;font-family:var(--font-title)}
.stat .lbl{font-size:12px;color:var(--text-3);margin-top:2px}

.alert{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:8px;border:1px solid;font-size:13.5px;margin-bottom:14px}
.alert i{margin-top:2px}
.alert-success{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.alert-error{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.alert-warning{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.alert-info{background:var(--info-soft);border-color:var(--info);color:var(--info)}

.empty{text-align:center;padding:40px 20px;color:var(--text-3);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty i{font-size:36px;opacity:.4}

.chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding:12px 0 32px;border-bottom:1px solid var(--border);position:relative}
.chart .bar{flex:1;min-height:4px;background:var(--primary);border-radius:6px 6px 0 0;position:relative}
.chart .bar:hover{filter:brightness(1.15)}
.chart .bar .v{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--primary)}
.chart .bar .l{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-3);white-space:nowrap}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
.bar-row .n{min-width:110px;color:var(--text-2)}
.bar-row .track{flex:1;height:18px;background:var(--surface-2);border-radius:20px;overflow:hidden;border:1px solid var(--border)}
.bar-row .fill{height:100%;background:var(--primary);border-radius:20px;display:flex;align-items:center;justify-content:flex-end;padding-left:8px;color:#fff;font-size:11px;font-weight:700;transition:width .5s ease}
.bar-row .v{min-width:50px;text-align:left;font-weight:700;font-size:12.5px}

.modal{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);animation:fade .2s ease}
.modal.open{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal .box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.modal .box.wide{max-width:900px}
.modal .box.small{max-width:420px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
.modal-head h3 i{color:var(--primary)}
.close-x{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);background:var(--surface-2);transition:all var(--tr)}
.close-x:hover{background:var(--bad-soft);color:var(--bad)}

.q-card{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;background:var(--surface-2)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.q-opt{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.q-opt input[type=text]{flex:1}
.q-opt input[type=radio],.q-opt input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);flex-shrink:0;cursor:pointer}
.q-opt .del{width:26px;height:26px;border-radius:6px;background:var(--bad-soft);color:var(--bad);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.q-opt .del:hover{background:var(--bad);color:#fff}

.toasts{position:fixed;bottom:20px;left:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);font-size:13.5px;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.t-ok{border-right:4px solid var(--ok)}.toast.t-err{border-right:4px solid var(--bad)}
.toast.t-warn{border-right:4px solid var(--warn)}.toast.t-info{border-right:4px solid var(--info)}

.bc-mini{display:inline-block;width:76px;height:32px;background:#fff;border:1px solid var(--border);border-radius:4px;padding:2px;vertical-align:middle}
.bc-mini svg{width:100%;height:100%;display:block}
.bc-box{background:#fff;padding:14px;border-radius:8px;text-align:center;border:1px solid var(--border)}
.bc-box svg{max-width:100%;height:auto;display:block;margin:0 auto}

.auth-wrap{max-width:440px;margin:40px auto}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px 28px;box-shadow:var(--shadow)}
.auth-icon{width:56px;height:56px;border-radius:14px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 14px}
.auth-title{text-align:center;font-size:22px;margin-bottom:6px}
.auth-sub{text-align:center;color:var(--text-3);font-size:13px;margin-bottom:20px}
.auth-tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;margin-bottom:20px}
.auth-tabs button{flex:1;padding:8px;border-radius:6px;font-size:13px;font-weight:700;color:var(--text-2);transition:all var(--tr)}
.auth-tabs button.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}

.hero{text-align:center;padding:40px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:20px}
.hero .logo{width:68px;height:68px;border-radius:18px;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px}
.hero h1{font-size:30px;margin-bottom:8px}
.hero p{color:var(--text-2);max-width:520px;margin:0 auto 22px;font-size:14.5px}
.hero .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.feature{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.feature .ico{width:48px;height:48px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.feature h4{font-size:15px;margin-bottom:4px}
.feature p{font-size:12.5px;color:var(--text-3)}

.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin:16px 0 12px}
.podium .p{text-align:center;padding:14px 8px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);transition:transform var(--tr)}
.podium .p:hover{transform:translateY(-3px)}
.podium .p .avatar{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;margin-bottom:6px}
.podium .p .nm{font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .p .sc{font-size:11.5px;color:var(--text-3);margin-top:2px}
.podium .p .medal{font-size:22px;line-height:1}
.podium .first{background:linear-gradient(180deg,#fef3c7,#fde68a);border-color:#f59e0b;transform:scale(1.05)}
[data-theme=dark] .podium .first{background:linear-gradient(180deg,#451a03,#78350f);border-color:#f59e0b}
.podium .second{background:linear-gradient(180deg,#f1f5f9,#e2e8f0)}
[data-theme=dark] .podium .second{background:linear-gradient(180deg,#1e293b,#334155)}
.podium .third{background:linear-gradient(180deg,#fed7aa,#fdba74)}
[data-theme=dark] .podium .third{background:linear-gradient(180deg,#431407,#7c2d12)}

.rank-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px}
.rank-row:last-child{border-bottom:none}
.rank-row .pos{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.rank-row .pos.g1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.rank-row .pos.g2{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff}
.rank-row .pos.g3{background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff}
.rank-row .nm{flex:1;font-weight:600}
.rank-row .bar{flex:1;height:8px;background:var(--surface-2);border-radius:20px;overflow:hidden;max-width:180px}
.rank-row .bar .fill{height:100%;background:var(--primary)}
.rank-row .pct{min-width:44px;text-align:left;font-weight:700;font-size:12px;color:var(--primary)}

/* Platform card */
.platform-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;transition:all var(--tr)}
.platform-card:hover{border-color:var(--primary-soft);box-shadow:var(--shadow)}
.platform-card .plat-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.platform-card .plat-logo{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0}
.platform-card .plat-name{font-weight:700;font-size:14px}
.platform-card .plat-sub{font-size:11.5px;color:var(--text-3)}
.platform-card .field-row{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:var(--surface-2);border-radius:6px;margin-bottom:4px;font-size:13px}
.platform-card .field-row .lbl{color:var(--text-3);font-size:12px;font-weight:600}
.platform-card .field-row .val{font-family:'Courier New',monospace;font-weight:700}
.platform-card .field-row .val.obscured{filter:blur(4px);cursor:pointer}
.platform-card .field-row .val.obscured:hover{filter:none}

/* Timetable */
.tt-table{width:100%;border-collapse:collapse;font-size:13px}
.tt-table th{background:var(--primary);color:#fff;padding:10px;text-align:center;font-size:12.5px}
.tt-table td{padding:10px;border:1px solid var(--border);text-align:center;vertical-align:top}
.tt-table .period{font-weight:700;color:var(--primary)}
.tt-table .time{font-size:11px;color:var(--text-3);display:block;margin-top:2px}
.tt-table .subject{font-weight:700;color:var(--text)}
.tt-table .teacher{font-size:11.5px;color:var(--text-3)}
.tt-table .empty-cell{color:var(--text-3);font-style:italic;font-size:12px}

/* Subject-chip */

<body>

<div id="backdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;" onclick="window.closeSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><i class="fas fa-chalkboard-teacher"></i><span>لوحة المعلم</span></div>
    <div class="side-user" id="sideUser"></div>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-foot">
      <button class="icon-btn theme-toggle" onclick="window.toggleTheme()"><i class="fas fa-moon"></i><span>الوضع الليلي</span></button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="page-title" id="pageTitle"><i class="fas fa-home"></i> <span>الرئيسية</span></div>
      <div class="top-actions"><button class="icon-btn menu-btn" onclick="window.openSidebar()"><i class="fas fa-bars"></i></button></div>
    </div>
    <main class="content" id="app">
      <div style="text-align:center;padding:60px 20px"><i class="fas fa-spinner fa-spin" style="font-size:32px;color:var(--primary)"></i><div style="margin-top:16px;color:var(--text-2)">جارِ الاتصال...</div></div>
    </main>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<!-- Modals -->
<div class="modal" id="mScan"><div class="box small">
  <div class="modal-head"><h3><i class="fas fa-barcode"></i> مسح الباركود</h3><button class="close-x" onclick="window.closeScan()"><i class="fas fa-times"></i></button></div>
  <div style="border-radius:8px;overflow:hidden;border:2px solid var(--primary);background:#000;"><video id="barcodeVideo" autoplay playsinline muted style="width:100%;display:block;"></video></div>
  <p class="muted center" style="margin-top:10px"><i class="fas fa-info-circle"></i> وجّه الكاميرا أو استخدم قارئ USB</p>
  <div id="barcodeResult" style="margin-top:10px"></div>
</div></div>

<div class="modal" id="mBarcodeView"><div class="box small">
  <div class="modal-head"><h3><i class="fas fa-barcode"></i> الباركود</h3><button class="close-x" onclick="window.closeModal('mBarcodeView')"><i class="fas fa-times"></i></button></div>
  <div id="barcodeViewContent"></div>
</div></div>

<div class="modal" id="mConfirm"><div class="box small">
  <div class="modal-head"><h3><i class="fas fa-question-circle"></i> تأكيد</h3><button class="close-x" onclick="window.closeModal('mConfirm')"><i class="fas fa-times"></i></button></div>
  <p id="confirmMsg" style="font-size:14px;color:var(--text-2);margin-bottom:20px;"></p>
  <div style="display:flex;gap:8px"><button class="btn btn-danger" onclick="window.confirmYes()"><i class="fas fa-check"></i> تأكيد</button><button class="btn btn-secondary" onclick="window.closeModal('mConfirm')">إلغاء</button></div>
</div></div>

<div class="modal" id="mAccount"><div class="box">
  <div class="modal-head"><h3><i class="fas fa-user-edit"></i> بيانات حسابي</h3><button class="close-x" onclick="window.closeModal('mAccount')"><i class="fas fa-times"></i></button></div>
  <form class="form" onsubmit="return window.updateAccount(event)">
    <div class="field"><label>الاسم</label><input class="input" id="accName" required /></div>
    <div class="field"><label>اسم المستخدم</label><input class="input" id="accUsername" required /></div>
    <hr style="border:none;border-top:1px solid var(--border);margin:6px 0" />
    <div class="field"><label>كلمة المرور الحالية</label><input class="input" type="password" id="accOldPass" /></div>
    <div class="field"><label>كلمة المرور الجديدة (اتركها فارغة لعدم التغيير)</label><input class="input" type="password" id="accNewPass" /></div>
    <div class="field"><label>تأكيد كلمة المرور الجديدة</label><input class="input" type="password" id="accNewPass2" /></div>
    <div id="accMsg"></div>
    <button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> حفظ التغييرات</button>
  </form>
</div></div>

<div class="modal" id="mExam"><div class="box wide">
  <div class="modal-head"><h3><i class="fas fa-pencil-alt"></i> <span id="examModalTitle">إنشاء اختبار</span></h3><button class="close-x" onclick="window.closeModal('mExam')"><i class="fas fa-times"></i></button></div>
  <form onsubmit="return window.saveExam(event)" id="examForm">
    <input type="hidden" id="examId" />
    <div class="form-row" style="margin-bottom:8px">
      <div class="field" style="flex:2"><label>اسم الاختبار</label><input class="input" id="examName" required /></div>
      <div class="field" style="flex:2"><label>الوصف</label><input class="input" id="examDescription" /></div>
    </div>
    <div class="form-row" style="margin-bottom:8px">
      <div class="field"><label>المدة (دقائق)</label><input class="input" type="number" id="examDuration" value="30" min="1" required /></div>
      <div class="field"><label>المحاولات</label><input class="input" type="number" id="examAttempts" value="1" min="1" required /></div>
      <div class="field"><label>الصف</label><select class="input" id="examClass" required></select></div>
      <div class="field"><label>الفصل</label><select class="input" id="examSection"><option value="">كل الفصول</option></select></div>
    </div>
    <div class="form-row" style="margin-bottom:8px">
      <div class="field"><label>المادة</label><select class="input" id="examSubject"><option value="">بدون مادة</option></select></div>
      <div class="field"><label>الحالة</label><select class="input" id="examStatus"><option value="active">نشط</option><option value="draft">مسودة</option><option value="closed">مغلق</option></select></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <label class="check-row"><input type="checkbox" id="examShuffle" /> عشوائية الأسئلة</label>
      <label class="check-row"><input type="checkbox" id="examVisible" checked /> مرئي للطالب</label>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <h4 style="font-size:14px;margin:0">الأسئلة</h4>
      <button type="button" class="btn btn-secondary btn-sm" onclick="window.addQuestion()"><i class="fas fa-plus"></i> سؤال</button>
    </div>
    <div id="questionsBox"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> <span id="examSaveText">حفظ</span></button>
      <button type="button" class="btn btn-secondary" onclick="window.closeModal('mExam')">إلغاء</button>
    </div>
  </form>
</div></div>

<div class="modal" id="mResult"><div class="box wide">
  <div class="modal-head"><h3><i class="fas fa-chart-bar"></i> النتائج</h3><button class="close-x" onclick="window.closeModal('mResult')"><i class="fas fa-times"></i></button></div>
  <div id="resultBody"></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDN_oCsbmOxEfIH_D6Vju1AZK3pkpQr-DY",
  authDomain: "school-system-manager-91675.firebaseapp.com",
  projectId: "school-system-manager-91675",
  storageBucket: "school-system-manager-91675.firebasestorage.app",
  messagingSenderId: "337434904928",
  appId: "1:337434904928:web:a083a8fceff11a2f51f605",
  measurementId: "G-JNWZ745V4J"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const DOC_REF = doc(db, "school-management", "data");

let DATA = {};
let me = null;
let route = 'home';
let routeParam = null;
let theme = localStorage.getItem('theme_teacher') || 'light';
let confirmCb = null;
let scanStream = null, scanDetector = null, scanning = false;
let saving = false;
let pollTimer = null;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (p='') => p + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const today = () => new Date().toISOString().slice(0,10);
const nowIso = () => new Date().toISOString();
const normalize = t => (t||'').toString().trim().replace(/[اآإأ]/g,'ا').replace(/[ىئي]/g,'ي').replace(/ؤ/g,'و').replace(/ة/g,'ه').replace(/\s+/g,' ').toLowerCase();

async function hash(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
function genCode(len=8){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code;
  do { code = Array.from({length:len}, () => chars[Math.floor(Math.random()*chars.length)]).join(''); }
  while (DATA.users?.some(u=>u.code===code) || DATA.students?.some(s=>s.code===code) || DATA.exams?.some(e=>e.code===code));
  return code;
}
function toast(msg, type='info'){
  const t = document.createElement('div');
  t.className = 'toast t-' + (type==='success'?'ok':type==='error'?'err':type==='warning'?'warn':'info');
  const ic = {success:'check-circle',error:'exclamation-circle',warning:'exclamation-triangle',info:'info-circle'}[type]||'info-circle';
  t.innerHTML = `<i class="fas fa-${ic}"></i><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(-20px)'; setTimeout(()=>t.remove(),300); }, 3500);
}
function openModal(id){ document.getElementById(id)?.classList.add('open'); }
function closeModal(id){ document.getElementById(id)?.classList.remove('open'); }

/* ============ SCHEMA v4 ============ */
const SCHEMA_VERSION = 4;
const DEFAULT_DB = () => ({
  meta: { version: SCHEMA_VERSION, createdAt: nowIso(), lastUpdate: nowIso(), schoolName: 'مدرستي' },
  users: [], classes: [], sections: [], students: [], subjects: [],
  attendance: [], teacherAttendance: [], grades: [], exams: [], examResults: [], notes: [],
  platforms: [],            // { id, name, color, fields:[{id,name,key}], createdAt }
  studentPlatforms: [],     // { id, studentId, platformId, values:{fieldId:value} }
  timetables: []            // { id, sectionId, classId, entries:[{id, day, period, from, to, subjectId, teacherId, room}] }
});

function migrate(d){
  if (!d || typeof d !== 'object') d = {};
  if (!d.meta || typeof d.meta !== 'object') d.meta = {};
  if (!d.meta.version) d.meta.version = 1;
  ['users','classes','sections','students','subjects','attendance','teacherAttendance','grades','exams','examResults','notes','platforms','studentPlatforms','timetables']
    .forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  d.users = d.users.map(u => ({
    ...u, role: u.role || 'teacher', isActive: u.isActive === true, rejected: u.rejected === true,
    code: u.code || '', sectionIds: Array.isArray(u.sectionIds) ? u.sectionIds : [],
    subjectIds: Array.isArray(u.subjectIds) ? u.subjectIds : [], rank: u.rank || ''
  }));
  d.exams = d.exams.map(e => ({
    ...e,
    questions: Array.isArray(e.questions) ? e.questions.map(q => ({
      id: q.id || uid('q_'), text: q.text || '', type: q.type || 'single',
      points: Number(q.points) || 1, options: Array.isArray(q.options) ? q.options : [],
      correct: q.correct || '', modelAnswer: q.modelAnswer || ''
    })) : [],
    totalPoints: Number(e.totalPoints) || 0, status: e.status || 'active',
    visible: e.visible !== false, shuffle: e.shuffle === true,
    attempts: Number(e.attempts) || 1, duration: Number(e.duration) || 30, code: e.code || ''
  }));
  d.examResults = d.examResults.map(r => ({
    ...r, answers: r.answers || {}, score: Number(r.score) || 0, max: Number(r.max) || 0,
    attempt: Number(r.attempt) || 1, status: r.status || 'completed'
  }));
  d.platforms = d.platforms.map(p => ({
    ...p, name: p.name || 'منصة', color: p.color || '#0f766e',
    fields: Array.isArray(p.fields) ? p.fields : []
  }));
  d.timetables = d.timetables.map(t => ({
    ...t, entries: Array.isArray(t.entries) ? t.entries : []
  }));
  d.meta.version = SCHEMA_VERSION;
  return d;
}

async function loadData(){
  try {
    const snap = await getDoc(DOC_REF);
    if (snap.exists()) {
      DATA = migrate(snap.data().payload || snap.data());
      try { await setDoc(DOC_REF, { payload: DATA }); } catch(e) {}
      return { ok: true, created: false };
    }
    DATA = migrate(DEFAULT_DB());
    try { await setDoc(DOC_REF, { payload: DATA }); return { ok: true, created: true }; }
    catch(e) {
      if (e.code === 'permission-denied') return { ok: false, message: 'قواعد الأمان تمنع الكتابة. Firestore → Rules → allow read, write: if true;' };
      return { ok: false, message: 'خطأ: ' + (e.message || 'غير معروف') };
    }
  } catch(e) {
    if (e.code === 'not-found') return { ok: false, message: 'قاعدة Firestore غير موجودة.' };
    return { ok: false, message: 'تعذر الاتصال: ' + (e.message || 'تحقق من الإنترنت') };
  }
}

async function saveData(){
  if (saving) return false;
  saving = true;
  try { DATA.meta.lastUpdate = nowIso(); await setDoc(DOC_REF, { payload: DATA }); return true; }
  catch(e) {
    if (e.code === 'permission-denied') toast('⛔ صلاحية الكتابة ممنوعة', 'error');
    else toast('فشل الحفظ', 'error');
    return false;
  } finally { saving = false; }
}

function startPolling(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (saving || document.hidden) return;
    try {
      const snap = await getDoc(DOC_REF);
      if (snap.exists()) {
        const incoming = migrate(snap.data().payload || snap.data());
        if (incoming.meta.lastUpdate !== DATA.meta.lastUpdate) { DATA = incoming; render(); }
      }
    } catch(e){}
  }, 30000);
}

function saveMe(u){ localStorage.setItem('me_teacher', JSON.stringify(u)); }
function loadMe(){ try { return JSON.parse(localStorage.getItem('me_teacher')||'null'); } catch(e){ return null; } }
function clearMe(){ localStorage.removeItem('me_teacher'); }

function applyTheme(t){
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  localStorage.setItem('theme_teacher', t);
  const ico = $('.theme-toggle i'); if (ico) ico.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}
function toggleTheme(){ applyTheme(theme === 'light' ? 'dark' : 'light'); }
function openSidebar(){ $('#sidebar').classList.add('open'); $('#backdrop').style.display = 'block'; }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#backdrop').style.display = 'none'; }
function go(r, param=null){ route = r; routeParam = param; closeSidebar(); render(); window.scrollTo({top:0, behavior:'smooth'}); }

/* ============ BARCODE ============ */
function barcodeSVG(code, opts={}){
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.style.background = '#fff';
  try {
    JsBarcode(svg, (code||'').toUpperCase().trim(), {format:'CODE128', width:2, height:(opts.h||60), displayValue:true, fontSize:12, font:'monospace', fontOptions:'bold', textMargin:3, margin:6, background:'#fff', lineColor:'#000'});
    const bb = svg.getBBox();
    if (bb.width && bb.height) svg.setAttribute('viewBox', `0 0 ${Math.ceil(bb.width)} ${Math.ceil(bb.height)}`);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('width','100%'); svg.setAttribute('height','100%'); svg.style.display = 'block';
    return svg.outerHTML;
  } catch(e) { return `<div style="text-align:center;font-family:monospace;font-size:11px;padding:8px;">${esc(code)}</div>`; }
}
window.viewBarcode = function(kind, id){
  const item = kind === 'student' ? DATA.students.find(s=>s.id===id) : DATA.users.find(u=>u.id===id);
  if (!item) return;
  const svg = barcodeSVG(item.code, {h:70});
  let extra = '';
  if (kind==='student') {
    const cls = DATA.classes.find(c=>c.id===item.classId);
    const sec = DATA.sections.find(s=>s.id===item.sectionId);
    extra = `${cls?.name||''} ${sec?('— '+sec.name):''}`;
  } else {
    extra = item.rank || (item.role==='admin'?'أدمن':'معلم');
  }
  $('#barcodeViewContent').innerHTML = `
    <div class="bc-box" style="margin-bottom:10px">${svg}</div>
    <div style="font-weight:700;text-align:center;">${esc(item.name)}</div>
    <div class="muted center" style="margin-bottom:12px">${esc(extra)}</div>
    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" onclick="window.downloadBarcode('${esc(item.code)}')"><i class="fas fa-download"></i> تحميل PNG</button>
      <button class="btn btn-secondary btn-sm" onclick="window.copyText('${esc(item.code)}',this)"><i class="fas fa-copy"></i> نسخ</button>
    </div>`;
  openModal('mBarcodeView');
};
window.downloadBarcode = function(code){
  const c = document.createElement('canvas');
  try {
    JsBarcode(c, (code||'').toUpperCase(), {format:'CODE128', width:4, height:150, displayValue:true, fontSize:24, font:'monospace', fontOptions:'bold', textMargin:8, margin:18, background:'#fff', lineColor:'#000'});
    c.toBlob(b => {
      if (!b) return toast('فشل', 'error');
      const url = URL.createObjectURL(b);
      const a = document.createElement('a'); a.href = url; a.download = `barcode-${code}.png`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1200);
      toast('تم التحميل', 'success');
    }, 'image/png');
  } catch(e) { toast('فشل', 'error'); }
};
window.copyText = function(text, btn){
  const done = () => { if (btn) { const o = btn.innerHTML; btn.innerHTML = '<i class="fas fa-check"></i>'; setTimeout(()=>btn.innerHTML=o, 1000); } toast('تم النسخ', 'success'); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(done);
  else { const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e){} document.body.removeChild(ta); done(); }
};

/* ============ SCAN ============ */
window.startScan = async function(){
  openModal('mScan'); $('#barcodeResult').innerHTML = '';
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    $('#barcodeVideo').srcObject = scanStream;
    scanning = true;
    if ('BarcodeDetector' in window) {
      scanDetector = new BarcodeDetector({ formats: ['code_128','code_39','ean_13','ean_8','qr_code','codabar','itf','upc_a','upc_e'] });
      loopScan();
    } else {
      $('#barcodeResult').innerHTML = '<div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i> المتصفح لا يدعم المسح.</div>';
    }
  } catch(e) { $('#barcodeResult').innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> تعذر الوصول للكاميرا.</div>'; }
};
async function loopScan(){
  const video = $('#barcodeVideo');
  if (!scanning || !scanDetector) return;
  try {
    const hits = await scanDetector.detect(video);
    if (hits.length) {
      const code = hits[0].rawValue.trim().toUpperCase();
      scanning = false;
      if (scanStream) { scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
      $('#barcodeResult').innerHTML = `<div class="alert alert-success"><i class="fas fa-check"></i> تم مسح: <strong>${esc(code)}</strong></div>`;
      setTimeout(() => { closeModal('mScan'); onScanned(code); }, 600);
      return;
    }
  } catch(e){}
  requestAnimationFrame(loopScan);
}
window.closeScan = function(){
  scanning = false;
  if (scanStream) { scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
  scanDetector = null; closeModal('mScan');
};
function onScanned(code){
  const student = DATA.students.find(s=>s.code===code);
  if (student) {
    if (!canAccessStudent(student)) return toast('هذا الطالب خارج فصولك', 'error');
    markAttendance(student.id, 'حاضر'); go('attendance'); return;
  }
  const user = DATA.users.find(u=>u.code===code);
  if (user) { toast(`هذا كود معلم: ${user.name}`, 'info'); return; }
  toast('كود غير معروف', 'error');
}

function canAccessStudent(st){
  if (!me) return false;
  if (me.role === 'admin') return true;
  return (me.sectionIds||[]).includes(st.sectionId);
}

async function markAttendance(studentId, status, note=''){
  const st = DATA.students.find(s=>s.id===studentId);
  if (!st) return;
  if (!canAccessStudent(st)) return toast('لا تملك صلاحية', 'error');
  const ex = DATA.attendance.find(a => a.targetType==='student' && a.targetId===studentId && a.date===today());
  if (ex) { ex.status = status; ex.note = note || ex.note || ''; ex.by = me.id; ex.at = nowIso(); }
  else DATA.attendance.push({ id: uid('att_'), targetType:'student', targetId: studentId, date: today(), status, note, by: me.id, at: nowIso() });
  await saveData();
  toast(`تم "${status}" لـ ${st.name}`, 'success'); render();
}

function mySections(){ return me?.sectionIds || []; }
function mySubjects(){ return me?.subjectIds || []; }
function myStudents(){
  if (!me) return [];
  if (me.role === 'admin') return DATA.students;
  const secs = mySections();
  return DATA.students.filter(s => secs.includes(s.sectionId));
}
function myExamsList(){
  if (!me) return [];
  if (me.role === 'admin') return DATA.exams;
  const secs = mySections(); const subs = mySubjects();
  return DATA.exams.filter(e => (e.sectionId && secs.includes(e.sectionId)) || (e.subjectId && subs.includes(e.subjectId)) || (e.teacherId === me.id));
}
function computeStudentScore(st){
  const sAtt = DATA.attendance.filter(a=>a.targetType==='student' && a.targetId===st.id);
  const present = sAtt.filter(a=>a.status==='حاضر').length;
  const attPct = sAtt.length ? (present/sAtt.length)*100 : 0;
  const sGrades = DATA.grades.filter(g=>g.studentId===st.id);
  const avgGrade = sGrades.length ? sGrades.reduce((s,g)=>s + (g.max?(g.score/g.max)*100:0), 0) / sGrades.length : 0;
  const sResults = DATA.examResults.filter(r=>r.studentId===st.id && r.status==='completed');
  const avgExam = sResults.length ? sResults.reduce((s,r)=>s + (r.max?(r.score/r.max)*100:0), 0) / sResults.length : 0;
  const count = sAtt.length + sGrades.length + sResults.length;
  return { st, score: count > 0 ? (attPct*0.4 + avgGrade*0.3 + avgExam*0.3) : 0, attPct, avgGrade, avgExam, count };
}

window.doLogin = async function(ev){
  ev.preventDefault();
  const f = ev.target;
  const username = f.username.value.trim(), password = f.password.value;
  const msg = $('#authMsg');
  const u = DATA.users.find(x => x.username === username);
  if (!u) { msg.innerHTML = '<div class="alert alert-error"><i class="fas fa-times-circle"></i> بيانات غير صحيحة.</div>'; return false; }
  const h = await hash(password);
  if (u.passwordHash !== h) { msg.innerHTML = '<div class="alert alert-error"><i class="fas fa-times-circle"></i> بيانات غير صحيحة.</div>'; return false; }
  if (u.rejected) { msg.innerHTML = '<div class="alert alert-error"><i class="fas fa-ban"></i> تم رفض حسابك.</div>'; return false; }
  if (!u.isActive) { msg.innerHTML = '<div class="alert alert-warning"><i class="fas fa-clock"></i> حسابك بانتظار موافقة الأدمن.</div>'; return false; }
  if (u.role === 'admin') { msg.innerHTML = '<div class="alert alert-info"><i class="fas fa-info-circle"></i> أنت أدمن — استخدم adminymo.html.</div>'; return false; }
  me = { id: u.id, name: u.name, username: u.username, role: u.role, sectionIds: u.sectionIds || [], subjectIds: u.subjectIds || [] };
  saveMe(me);
  toast('تم الدخول', 'success');
  go('dashboard');
  return false;
};
window.doRegister = async function(ev){
  ev.preventDefault();
  const f = ev.target;
  const name = f.name.value.trim(), username = f.username.value.trim(), password = f.password.value, confirm = f.confirm.value;
  const msg = $('#authMsg');
  if (!name || !username || !password) { msg.innerHTML = '<div class="alert alert-error">أكمل الحقول.</div>'; return false; }
  if (password !== confirm) { msg.innerHTML = '<div class="alert alert-error">كلمتا المرور مختلفتان.</div>'; return false; }
  if (password.length < 6) { msg.innerHTML = '<div class="alert alert-error">6+ أحرف.</div>'; return false; }
  if (DATA.users.some(u => u.username === username)) { msg.innerHTML = '<div class="alert alert-error">اسم المستخدم مستخدم.</div>'; return false; }
  const h = await hash(password);
  const code = genCode(8);
  DATA.users.push({ id: uid('u_'), name, username, passwordHash: h, code, role: 'teacher', isActive: false, rejected: false, sectionIds: [], subjectIds: [], rank: '', createdAt: nowIso() });
  const ok = await saveData();
  if (!ok) { DATA.users = DATA.users.filter(u => u.username !== username); msg.innerHTML = '<div class="alert alert-error">فشل الحفظ.</div>'; return false; }
  toast('✅ تم إنشاء الحساب — بانتظار موافقة الأدمن', 'success');
  go('home');

};

window.updateAccount = async function(ev){
  ev.preventDefault();
  const u = DATA.users.find(x=>x.id===me.id); if (!u) return false;
  const name = $('#accName').value.trim(), username = $('#accUsername').value.trim();
  const oldPass = $('#accOldPass').value, newPass = $('#accNewPass').value, newPass2 = $('#accNewPass2').value;
  const msg = $('#accMsg');
  if (!name || !username) { msg.innerHTML = '<div class="alert alert-error">أكمل الحقول.</div>'; return false; }
  if (username !== u.username && DATA.users.some(x => x.username === username && x.id !== u.id)) { msg.innerHTML = '<div class="alert alert-error">اسم المستخدم مستخدم.</div>'; return false; }
  if (newPass || newPass2) {
    if (!oldPass) { msg.innerHTML = '<div class="alert alert-error">أدخل كلمة المرور الحالية.</div>'; return false; }
    const oldH = await hash(oldPass);
    if (u.passwordHash !== oldH) { msg.innerHTML = '<div class="alert alert-error">كلمة المرور الحالية خاطئة.</div>'; return false; }
    if (newPass !== newPass2) { msg.innerHTML = '<div class="alert alert-error">كلمتا المرور مختلفتان.</div>'; return false; }
    if (newPass.length < 6) { msg.innerHTML = '<div class="alert alert-error">6+ أحرف.</div>'; return false; }
    u.passwordHash = await hash(newPass);
  }
  u.name = name; u.username = username;
  const ok = await saveData();
  if (!ok) { msg.innerHTML = '<div class="alert alert-error">فشل الحفظ.</div>'; return false; }
  me.name = name; me.username = username; saveMe(me);
  toast('✅ تم تحديث بياناتك', 'success');
  closeModal('mAccount'); render();
  return false;
};

/* ============ ANALYTICS ============ */
function viewAnalytics(){
  const mySt = myStudents();
  const myStIds = new Set(mySt.map(s=>s.id));
  const att = DATA.attendance.filter(a=>a.targetType==='student' && myStIds.has(a.targetId));
  const grades = DATA.grades.filter(g=>myStIds.has(g.studentId));
  const dayMap = {};
  att.forEach(a => { if (!dayMap[a.date]) dayMap[a.date] = {p:0, ab:0}; if (a.status==='حاضر') dayMap[a.date].p++; else dayMap[a.date].ab++; });
  const days = Object.keys(dayMap).sort().slice(-14);
  const maxDay = Math.max(1, ...days.map(d => dayMap[d].p + dayMap[d].ab));
  const subjAvg = {};
  grades.forEach(g => { if (!subjAvg[g.subjectId]) subjAvg[g.subjectId] = { sum:0, count:0 }; subjAvg[g.subjectId].sum += g.max ? (g.score/g.max)*100 : 0; subjAvg[g.subjectId].count++; });
  const attPct = att.length ? Math.round(att.filter(a=>a.status==='حاضر').length / att.length * 100) : 0;
  const avgGrade = grades.length ? Math.round(grades.reduce((s,g)=>s + (g.max?(g.score/g.max)*100:0), 0) / grades.length) : 0;
  return `
    <div class="container">
      <div class="stats" style="margin-bottom:16px">
        <div class="stat"><div class="ico" style="background:var(--primary-soft);color:var(--primary)"><i class="fas fa-user-graduate"></i></div><div><div class="num">${mySt.length}</div><div class="lbl">طلابي</div></div></div>
        <div class="stat"><div class="ico" style="background:var(--ok-soft);color:var(--ok)"><i class="fas fa-check-circle"></i></div><div><div class="num">${attPct}%</div><div class="lbl">نسبة الحضور</div></div></div>
        <div class="stat"><div class="ico" style="background:var(--warn-soft);color:var(--warn)"><i class="fas fa-star"></i></div><div><div class="num">${avgGrade}%</div><div class="lbl">متوسط الدرجات</div></div></div>
      </div>
      <div class="card" style="margin-bottom:14px">
        <div class="card-head"><h3><i class="fas fa-chart-bar"></i> الحضور اليومي (آخر 14 يوم)</h3></div>
        ${days.length===0 ? '<div class="empty"><i class="fas fa-inbox"></i><div>لا بيانات</div></div>' : `
        <div class="chart">
          ${days.map(d => { const tot = dayMap[d].p + dayMap[d].ab; const h = tot > 0 ? (tot/maxDay)*100 : 0; return `<div class="bar" style="height:${Math.max(h,4)}%" title="${d}: ${dayMap[d].p} حاضر، ${dayMap[d].ab} غائب"><span class="v">${tot}</span><span class="l">${d.slice(5)}</span></div>`; }).join('')}
        </div>`}
      </div>
      <div class="card">
        <div class="card-head"><h3><i class="fas fa-book"></i> متوسط الدرجات بالمواد</h3></div>
        ${Object.keys(subjAvg).length===0 ? '<div class="empty">لا بيانات</div>' : Object.keys(subjAvg).map(sid => {
          const subj = DATA.subjects.find(s=>s.id===sid);
          const avg = Math.round(subjAvg[sid].sum / subjAvg[sid].count);
          return `<div class="bar-row"><div class="n">${esc(subj?.name||'—')}</div><div class="track"><div class="fill" style="width:${avg}%">${avg}%</div></div><div class="v">${subjAvg[sid].count}</div></div>`;
        }).join('')}
      </div>
    </div>`;
}

/* ============ LEADERBOARD ============ */
function viewLeaderboard(){
  const mySt = myStudents();
  const sections = mySections().map(sid => DATA.sections.find(s=>s.id===sid)).filter(Boolean);
  const classGroups = {};
  sections.forEach(sec => {
    const cls = DATA.classes.find(c=>c.id===sec.classId);
    const key = cls?.id || 'unknown';
    if (!classGroups[key]) classGroups[key] = { class: cls, sections: [] };
    classGroups[key].sections.push(sec);
  });
  const keys = Object.keys(classGroups);
  return `
    <div class="container">
      <div class="card" style="margin-bottom:14px">
        <div class="card-head"><h3><i class="fas fa-trophy"></i> أفضل الطلاب</h3></div>
        <p class="muted">الترتيب = الحضور (40%) + الدرجات (30%) + الاختبارات (30%).</p>
      </div>
      ${keys.length === 0 ? '<div class="card empty"><div>لا فصول مسندة</div></div>' : keys.map(cid => {
        const grp = classGroups[cid];
        const secIds = grp.sections.map(s=>s.id);
        const secStudents = DATA.students.filter(s=>secIds.includes(s.sectionId));
        const stats = secStudents.map(computeStudentScore).filter(x => x.count > 0).sort((a,b) => b.score - a.score);
        if (!stats.length) return `<div class="card" style="margin-bottom:14px"><div class="card-head"><h3><i class="fas fa-layer-group"></i> ${esc(grp.class?.name || 'فصولي')}</h3></div><div class="empty">لا بيانات كافية</div></div>`;
        const [first, second, third, ...rest] = stats;
        return `<div class="card" style="margin-bottom:14px">
          <div class="card-head"><h3><i class="fas fa-layer-group"></i> ${esc(grp.class?.name || 'فصولي')} <span class="muted">(${secStudents.length} طالب)</span></h3></div>
          <div class="podium">
            ${second ? `<div class="p second"><div class="medal">🥈</div><div class="avatar" style="background:#64748b">${esc(second.st.name.charAt(0))}</div><div class="nm">${esc(second.st.name)}</div><div class="sc">${Math.round(second.score)}%</div></div>` : '<div></div>'}
            ${first ? `<div class="p first"><div class="medal">🥇</div><div class="avatar" style="background:#f59e0b">${esc(first.st.name.charAt(0))}</div><div class="nm">${esc(first.st.name)}</div><div class="sc">${Math.round(first.score)}%</div></div>` : ''}
            ${third ? `<div class="p third"><div class="medal">🥉</div><div class="avatar" style="background:#ea580c">${esc(third.st.name.charAt(0))}</div><div class="nm">${esc(third.st.name)}</div><div class="sc">${Math.round(third.score)}%</div></div>` : '<div></div>'}
          </div>
          ${rest.length ? `<div style="margin-top:14px">${rest.slice(0,15).map((x, i) => `<div class="rank-row"><div class="pos">${i+4}</div><div class="nm">${esc(x.st.name)}</div><div class="bar"><div class="fill" style="width:${Math.round(x.score)}%"></div></div><div class="pct">${Math.round(x.score)}%</div></div>`).join('')}</div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
}

window.setAttDate = v => { attDate = v; render(); };
window.setAttFilter = (key, v) => { if (key==='attSF') attSF = v; else if (key==='attStat') attStat = v; render(); };
window.deleteAttendanceRecord = function(id){
  askConfirm('حذف هذا السجل؟', async () => {
    DATA.attendance = DATA.attendance.filter(a => a.id !== id);
    await saveData(); toast('تم الحذف', 'success'); render();
  });
};
window.deleteAttendanceDay = function(){
  const myStIds = new Set(myStudents().map(s=>s.id));
  askConfirm(`حذف كل سجلات ${attDate}؟`, async () => {
    DATA.attendance = DATA.attendance.filter(a => !(a.date === attDate && myStIds.has(a.targetId)));
    await saveData(); toast('تم الحذف', 'success'); render();
  });
};
window.exportAttendance = function(fmt){
  const myStIds = new Set(myStudents().map(s=>s.id));
  const list = DATA.attendance.filter(a => a.targetType==='student' && myStIds.has(a.targetId));
  if (fmt === 'csv') {
    let csv = '\uFEFF' + 'الاسم,الفصل,التاريخ,الحالة,ملاحظة\n';
    list.forEach(a => {
      const st = DATA.students.find(s=>s.id===a.targetId);
      const sec = DATA.sections.find(s=>s.id===st?.sectionId);
      csv += `"${st?.name||''}","${sec?.name||''}","${a.date}","${a.status}","${(a.note||'').replace(/"/g,'""')}"\n`;
    });
    downloadBlob(new Blob([csv], {type:'text/csv;charset=utf-8'}), `attendance-${today()}.csv`);
  } else {
    downloadBlob(new Blob([JSON.stringify(list, null, 2)], {type:'application/json'}), `attendance-${today()}.json`);
  }
  toast('تم التصدير', 'success');
};
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

  $('#examDescription').value = exam?.description || '';
  $('#examDuration').value = exam?.duration || 30;
  $('#examAttempts').value = exam?.attempts || 1;
  $('#examStatus').value = exam?.status || 'active';
  $('#examShuffle').checked = !!exam?.shuffle;
  $('#examVisible').checked = exam?.visible !== false;
  $('#examClass').innerHTML = `<option value="">اختر</option>${allowedClasses.map(c=>`<option value="${c.id}" ${exam?.classId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}`;

function addQuestionFromData(q){
  const div = document.createElement('div');
  div.className = 'q-card';
  const type = q.type || 'single';
  const qid = q.id || 'q_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  div.dataset.qid = qid;
  div.innerHTML = `
    <div class="q-head"><strong style="font-size:13px">سؤال</strong><button type="button" class="btn btn-danger btn-xs" onclick="this.closest('.q-card').remove()"><i class="fas fa-trash"></i></button></div>
    <div class="form-row" style="margin-bottom:8px">
      <div class="field" style="flex:2"><label>نص السؤال</label><input class="input q-text" value="${esc(q.text)}" required /></div>
      <div class="field"><label>النوع</label><select class="input q-type" onchange="window.changeQType(this)">
        <option value="single" ${type==='single'?'selected':''}>اختيار واحد</option>
        <option value="multiple" ${type==='multiple'?'selected':''}>اختيار متعدد</option>
        <option value="truefalse" ${type==='truefalse'?'selected':''}>صح/خطأ</option>
        <option value="essay" ${type==='essay'?'selected':''}>مقالي</option>
        <option value="complete" ${type==='complete'?'selected':''}>أكمل</option>
      </select></div>
      <div class="field"><label>الدرجة</label><input class="input q-points" type="number" value="${q.points}" min="1" /></div>
    </div>
    <div class="q-opts-box"><div class="q-opts"></div><button type="button" class="btn btn-secondary btn-xs" onclick="window.addOpt(this)"><i class="fas fa-plus"></i> خيار</button></div>
    <div class="q-model-box" style="display:none;margin-top:6px"><div class="field"><label>الإجابة النموذجية</label><input class="input q-model" value="${esc(q.modelAnswer||'')}" /></div></div>`;
  $('#questionsBox').appendChild(div);
  changeQType(div.querySelector('.q-type'));
  const optsBox = div.querySelector('.q-opts');
  const correct = (q.correct||'').split(',').map(x=>x.trim()).filter(Boolean);
  (q.options||[]).forEach(opt => {
    const item = document.createElement('div');
    item.className = 'q-opt';
    item.innerHTML = `<input type="${type==='multiple'?'checkbox':'radio'}" name="c_${qid}" value="${esc(opt)}" ${correct.includes(opt)?'checked':''} /><input class="input" type="text" value="${esc(opt)}" /><button type="button" class="del" onclick="this.closest('.q-opt').remove()"><i class="fas fa-times"></i></button>`;
    optsBox.appendChild(item);
  });
  if (q.modelAnswer) div.querySelector('.q-model').value = q.modelAnswer;
  if (type==='essay'||type==='complete') { div.querySelector('.q-opts-box').style.display='none'; div.querySelector('.q-model-box').style.display='block'; }
}
window.changeQType = function(sel){
  const card = sel.closest('.q-card');
  const type = sel.value;
  const qid = card.dataset.qid;
  const optsBox = card.querySelector('.q-opts-box');
  const modelBox = card.querySelector('.q-model-box');
  const opts = card.querySelector('.q-opts');
  if (type === 'essay' || type === 'complete') { optsBox.style.display = 'none'; modelBox.style.display = 'block'; return; }
  optsBox.style.display = 'block';
  modelBox.style.display = 'none';
  if (type === 'truefalse') {
    opts.innerHTML = '';
    ['صح','خطأ'].forEach(t => {
      const item = document.createElement('div');
      item.className = 'q-opt';
      item.innerHTML = `<input type="radio" name="c_${qid}" value="${t}" /><input class="input" type="text" value="${t}" readonly />`;
      opts.appendChild(item);
    });
  } else if (type === 'single') {
    opts.querySelectorAll('input[type=radio]').forEach((r,i) => { r.name = 'c_' + qid; if (i > 0) r.checked = false; });
  }
};
window.addOpt = function(btn){
  const card = btn.closest('.q-card');
  const type = card.querySelector('.q-type').value;
  const qid = card.dataset.qid;
  if (type !== 'single' && type !== 'multiple') return toast('غير متاح', 'warning');
  const opts = card.querySelector('.q-opts');
  const item = document.createElement('div');
  item.className = 'q-opt';
  item.innerHTML = `<input type="${type==='multiple'?'checkbox':'radio'}" name="c_${qid}" /><input class="input" type="text" placeholder="خيار جديد" /><button type="button" class="del" onclick="this.closest('.q-opt').remove()"><i class="fas fa-times"></i></button>`;
  opts.appendChild(item);
};
window.saveExam = async function(ev){
  ev.preventDefault();
  const id = $('#examId').value;
  const name = $('#examName').value.trim();
  const classId = $('#examClass').value;
  if (!name || !classId) return toast('أكمل', 'warning'), false;
  const questions = [];
  let valid = true;
  $$('#questionsBox .q-card').forEach((card, i) => {
    const text = card.querySelector('.q-text').value.trim();
    const type = card.querySelector('.q-type').value;
    const points = Math.max(1, +card.querySelector('.q-points').value || 1);
    const qid = card.dataset.qid || uid('q_');
    let options = [], correct = '', modelAnswer = '';
    if (type==='single'||type==='multiple'||type==='truefalse') {
      options = [...card.querySelectorAll('.q-opt input[type=text]')].map(inp=>inp.value.trim()).filter(Boolean);
      correct = [...card.querySelectorAll('.q-opt input[type=radio]:checked, .q-opt input[type=checkbox]:checked')].map(r=>r.value.trim()).filter(Boolean).join(',');
    } else { modelAnswer = card.querySelector('.q-model').value.trim(); }
    if (!text) { valid = false; toast(`السؤال ${i+1}: النص مطلوب`, 'warning'); return; }
    if ((type==='single'||type==='multiple') && options.length < 2) { valid = false; toast(`السؤال ${i+1}: خياران على الأقل`, 'warning'); return; }
    if ((type==='single'||type==='truefalse') && !correct) { valid = false; toast(`السؤال ${i+1}: حدد الإجابة`, 'warning'); return; }
    if (type==='single' && correct.split(',').length > 1) { valid = false; toast(`السؤال ${i+1}: اختيار واحد فقط`, 'warning'); return; }
    questions.push({ id: qid, text, type, points, options, correct, modelAnswer });
  });
  if (!valid) return false;
  if (questions.length === 0) return toast('أضف سؤالاً', 'warning'), false;
  const data = {
    name, description: $('#examDescription').value.trim(),
    duration: Math.max(1, +$('#examDuration').value || 30),
    attempts: Math.max(1, +$('#examAttempts').value || 1),
    classId, sectionId: $('#examSection').value || null,
    subjectId: $('#examSubject').value || null, status: $('#examStatus').value,
    shuffle: $('#examShuffle').checked, visible: $('#examVisible').checked,
    questions, totalPoints: questions.reduce((s,q)=>s+q.points,0),
    teacherId: me.id
  };
  if (id) { const ex = DATA.exams.find(e=>e.id===id); if (ex) Object.assign(ex, data); }
  else DATA.exams.push({ id: uid('ex_'), code: genCode(8), ...data, createdAt: nowIso() });
  await saveData(); toast('تم الحفظ', 'success'); closeModal('mExam'); render(); return false;
};
window.deleteExam = function(id){
  askConfirm('حذف الاختبار ونتائجه؟', async () => {
    DATA.exams = DATA.exams.filter(e=>e.id!==id);
    DATA.examResults = DATA.examResults.filter(r=>r.examId!==id);
    await saveData(); render();
  });
};

const DAYS = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
function viewTimetables(){
  const mySecs = mySections().map(id => DATA.sections.find(s=>s.id===id)).filter(Boolean);
  return `
    <div class="container">
      <div class="card" style="margin-bottom:14px">
        <div class="card-head"><h3><i class="fas fa-calendar-alt"></i> جداول الحصص</h3></div>
        <p class="muted" style="font-size:12.5px">هذه الجداول أُنشئت من قبل الأدمن لكل فصل. يمكنك رؤية جدول الفصول المسندة إليك.</p>
      </div>
      ${mySecs.length===0 ? '<div class="card empty"><div>لا فصول مسندة</div></div>' : mySecs.map(sec => {
        const cls = DATA.classes.find(c=>c.id===sec.classId);
        const tt = DATA.timetables.find(t=>t.sectionId===sec.id);
        return `<div class="card" style="margin-bottom:14px">
          <div class="card-head"><h3><i class="fas fa-door-open"></i> ${esc(cls?.name||'')} — ${esc(sec.name)}</h3></div>
          ${!tt || !tt.entries || tt.entries.length === 0 ? '<div class="empty">لا جدول لهذا الفصل</div>' : renderTimetableHTML(tt)}
        </div>`;
      }).join('')}
    </div>`;
}
function renderTimetableHTML(tt){
  const periods = [...new Set((tt.entries||[]).map(e=>e.period))].sort((a,b)=>a-b);
  if (periods.length === 0) return '<div class="empty">لا حصص</div>';
  let html = '<div style="overflow-x:auto"><table class="tt-table"><thead><tr><th>الحصة</th>';
  DAYS.forEach(d => html += `<th>${d}</th>`);
  html += '</tr></thead><tbody>';
  periods.forEach(p => {
    html += `<tr><td class="period">${p}</td>`;
    DAYS.forEach(d => {
      const e = (tt.entries||[]).find(x => x.day === d && x.period === p);
      if (e) {
        const subj = DATA.subjects.find(s=>s.id===e.subjectId);
        const teacher = DATA.users.find(u=>u.id===e.teacherId);
        html += `<td><div class="subject">${esc(subj?.name||'—')}</div><div class="teacher">${esc(teacher?.name||'—')}</div><div class="time">${esc(e.from||'')} - ${esc(e.to||'')}</div></td>`;
      } else {
        html += `<td class="empty-cell">—</td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

      ${!tt || !tt.entries || tt.entries.length === 0 ? '<p class="muted" style="font-size:12px">لا جدول متاح</p>' : renderTimetableHTML(tt)}
    </div>

    <!-- الاختبارات -->
    <div class="card" style="margin-bottom:12px;padding:14px">
      <h4 style="font-size:14px;margin-bottom:8px"><i class="fas fa-pencil-alt" style="color:var(--primary)"></i> اختباراتي (${visibleExams.length})</h4>
      ${visibleExams.length === 0 ? '<p class="muted" style="font-size:12px">لا اختبارات متاحة</p>' : visibleExams.map(ex => {
        const r = results.find(rr=>rr.examId===ex.id);
        const subj = DATA.subjects.find(s=>s.id===ex.subjectId);
        return `<div style="background:var(--surface-2);border-radius:8px;padding:10px;margin-bottom:6px;font-size:13px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
            <div><strong>${esc(ex.name)}</strong> <span class="muted" style="font-size:11.5px">${esc(subj?.name||'')}</span></div>
            <div>
              ${r ? `<span class="badge ${r.score>=r.max*0.5?'badge-ok':'badge-bad'}">${r.score}/${r.max}</span>` : `<span class="badge badge-warn">لم يشارك</span>`}
            </div>
          </div>
          <div style="font-size:11.5px;color:var(--text-3);margin-top:4px">
            <span>⏱️ ${ex.duration} دقيقة</span>
            <span>📝 ${ex.questions.length} سؤال</span>
            <span>🏆 ${ex.totalPoints} درجة</span>
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- الحضور -->
    <div class="card" style="margin-bottom:12px;padding:14px">
      <h4 style="font-size:14px;margin-bottom:8px"><i class="fas fa-clipboard-list" style="color:var(--primary)"></i> سجل الحضور (${att.length})</h4>
      ${att.length ? `<div style="display:flex;flex-wrap:wrap;gap:4px">${att.slice(0,30).map(a=>`<span class="badge ${a.status==='حاضر'?'badge-ok':'badge-bad'}">${esc(a.date)}: ${esc(a.status)}</span>`).join('')}</div>` : '<p class="muted" style="font-size:12px">لا سجلات</p>'}
    </div>

    <!-- الدرجات -->
    <div class="card" style="padding:14px">
      <h4 style="font-size:14px;margin-bottom:8px"><i class="fas fa-star" style="color:var(--primary)"></i> الدرجات (${grades.length})</h4>
      ${grades.length ? `<div class="table-wrap"><table><thead><tr><th>المادة</th><th>النوع</th><th>الدرجة</th></tr></thead><tbody>
        ${grades.map(g=>`<tr><td>${esc(DATA.subjects.find(s=>s.id===g.subjectId)?.name||'—')}</td><td>${esc(g.kind)}</td><td><span class="badge ${g.score>=g.max*0.5?'badge-ok':'badge-bad'}">${g.score}/${g.max}</span></td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted" style="font-size:12px">لا درجات</p>'}
    </div>
  `;
}

/* ============ STUDENT REPORT (INTERNAL) ============ */
function viewStudentReport(id){
  const st = DATA.students.find(s=>s.id===id);
  if (!st) return '<div class="container"><div class="alert alert-error">طالب غير موجود</div></div>';
  if (!canAccessStudent(st)) return '<div class="container"><div class="alert alert-error">غير مصرح</div></div>';
  return `<div class="container">
    <div class="no-print" style="display:flex;gap:6px;margin-bottom:12px">
      <button class="btn btn-secondary btn-sm" onclick="window.go('myStudents')"><i class="fas fa-arrow-right"></i> رجوع</button>
      <button class="btn btn-primary btn-sm" onclick="window.print()"><i class="fas fa-print"></i> طباعة</button>
    </div>
    <div id="studentReportBox"></div>
  </div>`;
}

/* ============ LOGOUT ============ */
window.logout = function(){ askConfirm('تسجيل الخروج؟', () => { me = null; clearMe(); go('home'); toast('تم', 'info'); }); };

let debounceTimers = {};
window.debounceSet = function(key, val){
  clearTimeout(debounceTimers[key]);
  debounceTimers[key] = setTimeout(() => {
    if (key === 'mQ') mQ = val;
    else if (key === 'attQ') attQ = val;
    render();
  }, 250);
};

/* ============ RENDER ============ */
function render(){
  renderSidebar(); renderTopBar();
  const app = $('#app');
  if (!me && !['home','auth','lookup'].includes(route)) route = 'home';
  let html = '';
  switch(route){
    case 'home': html = viewHome(); break;
    case 'auth': html = viewAuth(); break;
    case 'dashboard': html = viewDashboard(); break;
    case 'analytics': html = viewAnalytics(); break;
    case 'leaderboard': html = viewLeaderboard(); break;
    case 'myStudents': html = viewMyStudents(); break;
    case 'platforms': html = viewPlatforms(); break;
    case 'timetables': html = viewTimetables(); break;
    case 'attendance': html = viewAttendance(); break;
    case 'grades': html = viewGrades(); break;
    case 'exams': html = viewExams(); break;
    case 'lookup': html = viewLookup(); break;
    case 'studentReport': html = viewStudentReport(routeParam); break;
    default: html = viewHome();
  }
  app.innerHTML = html;
  if (route === 'auth') authTab('login');
  if (route === 'studentReport') {
    const st = DATA.students.find(s=>s.id===routeParam);
    if (st) {
      const box = $('#studentReportBox');
      if (box) renderStudentFullReport(st, box);
    }
  }
}

/* ============ INIT ============ */
(async function init(){
  applyTheme(theme);
  const app = $('#app');
  app.innerHTML = '<div style="text-align:center;padding:60px 20px"><i class="fas fa-spinner fa-spin" style="font-size:32px;color:var(--primary)"></i><div style="margin-top:16px;color:var(--text-2)">جارِ الاتصال...</div></div>';
  const res = await loadData();
  if (!res.ok) {
    app.innerHTML = `<div class="container"><div class="auth-wrap"><div class="auth-card" style="max-width:560px">
      <div class="auth-icon" style="background:var(--bad)"><i class="fas fa-database"></i></div>
      <div class="auth-title">تعذر الاتصال</div>
      <div class="alert alert-error" style="margin-top:16px"><i class="fas fa-exclamation-circle"></i><div>${esc(res.message)}</div></div>
      <button class="btn btn-primary btn-block" onclick="location.reload()"><i class="fas fa-redo"></i> إعادة المحاولة</button>
    </div></div></div>`;
    return;
  }
  if (res.created) toast('✅ تم إنشاء قاعدة البيانات تلقائياً', 'success');
  const saved = loadMe();
  if (saved) {
    const u = DATA.users.find(x=>x.id===saved.id);
    if (u && u.isActive && !u.rejected && u.role !== 'admin') {
      me = { id: u.id, name: u.name, username: u.username, role: u.role, sectionIds: u.sectionIds || [], subjectIds: u.subjectIds || [] };
      saveMe(me);
      if (route === 'home') route = 'dashboard';
    } else { clearMe(); }
  }
  render();
  startPolling();
})();

Object.assign(window, {
  go, toggleTheme, openSidebar, closeSidebar,
  openModal, closeModal,
  startScan, closeScan, viewBarcode, downloadBarcode, copyText,
  askConfirm, confirmYes, markAttendance,
  openExam, saveExam, addQuestion, changeQType, addOpt, deleteExam, viewExamResults,
  openAccount, updateAccount,
  exportAttendance, deleteAttendanceRecord, deleteAttendanceDay,
  openPlatformAdd, openPlatformEdit, addPlatformField, savePlatform, deletePlatform,
  viewPlatformStudents, openStudentPlatformAdd, editStudentPlatform, saveStudentPlatform, deleteStudentPlatform
});
</script>
